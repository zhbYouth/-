<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7fd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171834" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="吐纳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>吐纳</title>
<style>
:root{
  /* 版式：两层。第一层只有流动光球、方式名、时长、开始；第二层是方式列表、依据、语音与记录；练习是全屏覆盖层。
     配色：每种方式有自己的一对明亮渐变色（c 用于光球与背景，b 用于按钮），切换时颜色平滑过渡。 */
  color-scheme:light;
  --bg:#f6f7fd;
  --cell:#ffffff;
  --label:#1c1e3a;
  --label2:rgb(52 56 104 / .64);
  --sep:rgb(52 56 104 / .13);
  --fill:rgb(92 100 170 / .11);
  --fill-strong:rgb(92 100 170 / .2);
  --seg-on:#ffffff;
  --glass:rgb(255 255 255 / .66);
  --nav:rgb(250 250 255 / .82);
  --ma1:.38;--ma2:.34;--ma3:.24;
  --c1:47 208 185;--c2:90 169 255;--b1:8 140 124;--b2:38 108 214;
  --link:rgb(var(--b1));
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.45,.64,1);
  --smooth:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171834;--cell:#23254d;--label:#ffffff;--label2:rgb(226 229 255 / .68);--sep:rgb(190 196 255 / .16);
    --fill:rgb(150 160 255 / .16);--fill-strong:rgb(150 160 255 / .27);--seg-on:#555a96;
    --glass:rgb(70 74 130 / .55);--nav:rgb(30 32 66 / .84);--ma1:.36;--ma2:.3;--ma3:.22;
    --link:rgb(var(--c1));
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171834;--cell:#23254d;--label:#ffffff;--label2:rgb(226 229 255 / .68);--sep:rgb(190 196 255 / .16);
  --fill:rgb(150 160 255 / .16);--fill-strong:rgb(150 160 255 / .27);--seg-on:#555a96;
  --glass:rgb(70 74 130 / .55);--nav:rgb(30 32 66 / .84);--ma1:.36;--ma2:.3;--ma3:.22;
  --link:rgb(var(--c1));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--label);font-family:var(--f-ui);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* 背景：三团缓慢漂移的渐变色 */
.mesh{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.mesh i{position:absolute;display:block;width:110vmax;height:110vmax;border-radius:50%;will-change:transform}
.mesh i:nth-child(1){left:-55vmax;top:-60vmax;background:radial-gradient(circle,rgb(var(--c1) / var(--ma1)),transparent 62%);animation:drift1 17s ease-in-out infinite alternate}
.mesh i:nth-child(2){right:-60vmax;top:-10vmax;background:radial-gradient(circle,rgb(var(--c2) / var(--ma2)),transparent 62%);animation:drift2 21s ease-in-out infinite alternate}
.mesh i:nth-child(3){left:-30vmax;bottom:-80vmax;background:radial-gradient(circle,rgb(var(--c1) / var(--ma3)),transparent 62%);animation:drift3 25s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(16vmax,12vmax) scale(1.08)}}
@keyframes drift2{to{transform:translate(-14vmax,18vmax) scale(.94)}}
@keyframes drift3{to{transform:translate(20vmax,-12vmax) scale(1.1)}}

.layer{position:fixed;inset:0;display:flex;flex-direction:column}
.glass{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--sep);transition:transform .35s var(--spring)}
.glass:active{transform:scale(.88)}
.rise{animation:rise .7s var(--smooth) backwards;animation-delay:var(--d,0ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes swap{from{opacity:0;transform:translateY(10px) scale(.97)}}
.swap{animation:swap .5s var(--smooth)}

/* ---------- 第一层：主界面 ---------- */
.home{z-index:1;gap:12px;padding:calc(var(--sat) + 10px) max(20px,var(--sar)) calc(var(--sab) + 16px) max(20px,var(--sal));transition:transform .45s var(--smooth),opacity .45s}
.home.pushed{transform:translateX(-24%) scale(.97);opacity:.5}
.h-top{display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:12px}
.greet{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.greet b{font-size:26px;font-weight:700;letter-spacing:.01em}
.greet span{font-size:14px;color:var(--label2)}
.orb-stage{flex:1;min-height:170px;position:relative}
.orb-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.h-info{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.h-name{display:inline-flex;align-items:center;gap:4px;font-size:30px;font-weight:800;letter-spacing:.02em;line-height:1.2;min-height:44px;padding:0 10px;border-radius:14px;transition:transform .35s var(--spring)}
.h-name:active{transform:scale(.95)}
.h-name svg{color:var(--label2);flex:none;margin-top:3px}
.h-tag{font-size:15px;color:var(--label)}
.cap{font-size:14px;color:var(--label2)}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:2px}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n,4));background:var(--seg-on);border-radius:10px;box-shadow:0 2px 6px rgb(0 0 0 / .14);transform:translateX(calc(var(--i,0) * 100%));transition:transform .45s var(--spring)}
.seg button{position:relative;z-index:1;min-height:34px;border-radius:10px;font-size:14px;font-weight:500;transition:font-weight .2s,transform .3s var(--spring)}
.seg button[aria-pressed="true"]{font-weight:700}
.seg button:active{transform:scale(.94)}
.cta{position:relative;width:100%;min-height:58px;border-radius:999px;background:linear-gradient(120deg,rgb(var(--b1)),rgb(var(--b2)));color:#fff;font-size:19px;font-weight:700;letter-spacing:.14em;box-shadow:0 12px 26px -10px rgb(var(--b1) / .65);transition:transform .35s var(--spring),box-shadow .3s}
.cta::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;animation:halo 2.8s ease-out infinite}
@keyframes halo{0%{box-shadow:0 0 0 0 rgb(var(--b1) / .42)}70%,100%{box-shadow:0 0 0 18px rgb(var(--b1) / 0)}}
.cta:active{transform:scale(.96)}
.h-stat{text-align:center;min-height:20px;font-size:13px;color:var(--label2)}

/* ---------- 第二层：方式、依据、语音、记录 ---------- */
.lib{z-index:10;background:linear-gradient(180deg,rgb(var(--c1) / .14),transparent 38%),var(--bg);transform:translateX(100%);visibility:hidden;box-shadow:-10px 0 30px rgb(0 0 0 / .16);transition:transform .45s var(--smooth),visibility 0s .45s}
.lib.open{transform:none;visibility:visible;transition:transform .45s var(--smooth),visibility 0s}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(var(--sat) + 2px) max(8px,var(--sar)) 4px max(8px,var(--sal));min-height:calc(var(--sat) + 48px);background:var(--nav);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid var(--sep);z-index:2}
.nav-back{display:inline-flex;align-items:center;gap:2px;color:var(--link);font-size:17px;min-height:44px;padding:0 8px;justify-self:start}
.nav-title{font-size:17px;font-weight:700}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,var(--sar)) calc(var(--sab) + 36px) max(16px,var(--sal));display:flex;flex-direction:column;gap:22px}
.scroll.enter .sec{animation:rise .6s var(--smooth) backwards}
.scroll.enter .sec:nth-child(1){animation-delay:.05s}.scroll.enter .sec:nth-child(2){animation-delay:.12s}
.scroll.enter .sec:nth-child(3){animation-delay:.19s}.scroll.enter .sec:nth-child(4){animation-delay:.26s}
.scroll.enter .sec:nth-child(5){animation-delay:.33s}.scroll.enter .sec:nth-child(6){animation-delay:.4s}
.sec{display:flex;flex-direction:column;gap:7px}
.gh{font-size:13px;color:var(--label2);padding:0 16px;letter-spacing:.02em}
.gf{font-size:13px;color:var(--label2);padding:0 16px;line-height:1.55}
.group{background:var(--cell);border-radius:18px;overflow:hidden;box-shadow:0 1px 0 var(--sep)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:10px 16px;text-align:left;position:relative}
.row+.row::before,.cellt+.cellt::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
button.row{transition:background .15s}
button.row:active{background:var(--fill)}
.row[aria-pressed="true"]{background:linear-gradient(90deg,rgb(var(--tb1,var(--c1)) / .13),transparent 75%)}
.r-ic{width:44px;height:44px;border-radius:13px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,rgb(var(--tb1)),rgb(var(--tb2)));box-shadow:0 6px 12px -6px rgb(var(--tb1) / .7)}
.r-ic svg{width:30px;height:18px;overflow:visible}
.r-ic .wave-line{stroke:#fff;stroke-width:2.2}
.r-ic .wave-area{fill:rgb(255 255 255 / .25)}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column}
.r-name{font-size:17px;font-weight:600}
.r-sub{font-size:13px;color:var(--label2);line-height:1.45}
.badge{display:inline-block;font-size:11px;font-weight:600;color:var(--label2);background:var(--fill);border-radius:6px;padding:1px 7px;margin-top:3px;align-self:flex-start;letter-spacing:.02em}
.r-check{width:24px;height:24px;flex:none;color:rgb(var(--tb1,var(--b1)));display:grid;place-items:center}
.r-check svg{animation:pop .5s var(--spring)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.cellt{position:relative;padding:12px 16px;font-size:15px;line-height:1.6;display:flex;flex-direction:column;gap:2px}
.cellt .k{font-size:12.5px;color:var(--label2);font-weight:600;letter-spacing:.04em}
.cellt.warn{background:rgb(255 170 60 / .12)}
.cellt.warn .k{color:#c96a00}
:root[data-theme="dark"] .cellt.warn .k{color:#ffb454}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cellt.warn .k{color:#ffb454}}
.wave{position:relative;width:100%;aspect-ratio:320/96}
.wave svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wave-line{fill:none;stroke:url(#wg);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.wave-area{fill:rgb(var(--tb1,var(--c1)) / .18);stroke:none}
.wavebox{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
.pcs{display:flex;flex-wrap:wrap;gap:6px}
.pc{display:flex;align-items:baseline;gap:6px;background:var(--fill);border-radius:9px;padding:4px 11px;font-size:13px}
.pc b{font-family:var(--f-num);font-weight:700}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{min-width:34px;text-align:right;font-family:var(--f-num);font-weight:600;font-size:18px}
.pm{display:flex;background:var(--fill);border-radius:10px;overflow:hidden}
.pm button{width:48px;height:34px;font-size:22px;line-height:1;color:var(--link);transition:background .15s}
.pm button:active{background:var(--fill-strong)}
.pm button+button{border-left:.5px solid var(--sep)}
.pm button:disabled{opacity:.3;cursor:default}
.r-spacer{flex:1}
.sw{width:51px;height:31px;border-radius:999px;background:var(--fill-strong);position:relative;flex:none;transition:background .3s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgb(0 0 0 / .28);transition:transform .4s var(--spring)}
.sw[aria-checked="true"]{background:linear-gradient(120deg,rgb(var(--b1)),rgb(var(--b2)))}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.r-val{font-size:15px;color:var(--label2);display:flex;align-items:center;gap:4px}
.r-val svg{transition:transform .35s var(--spring)}
.r-val.open svg{transform:rotate(90deg)}
.vlist{overflow:hidden}
.vrow{min-height:48px;padding:6px 16px 6px 28px}
.vrow .r-name{font-size:16px;font-weight:500}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:92px;padding:16px 16px 0}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar i{display:block;width:100%;max-width:26px;border-radius:8px;background:var(--fill);min-height:5px;transform-origin:bottom;animation:grow .7s var(--spring) backwards}
.bar.has i{background:linear-gradient(180deg,rgb(var(--c2)),rgb(var(--c1)))}
.bar.today span{color:var(--label);font-weight:700}
.bar span{font-size:12px;color:var(--label2)}
@keyframes grow{from{transform:scaleY(.05)}}
.statline{padding:12px 16px 14px;font-size:15px;color:var(--label2)}
.statline b{color:var(--label);font-family:var(--f-num);font-weight:700}
.bpm{font-size:13px;color:var(--label2);padding:0 16px}
.bpm.bad{color:#c96a00}

/* ---------- 练习（全屏覆盖） ---------- */
.session{z-index:20;gap:6px;padding:calc(var(--sat) + 8px) max(20px,var(--sar)) calc(var(--sab) + 18px) max(20px,var(--sal));opacity:0;visibility:hidden;transition:opacity .35s,visibility 0s .35s;background:radial-gradient(90% 55% at 50% 36%,rgb(var(--c1) / .3),transparent 72%),radial-gradient(70% 45% at 88% 96%,rgb(var(--c2) / .3),transparent 72%),var(--bg)}
.session.on{opacity:1;visibility:visible;transition:opacity .35s,visibility 0s}
.s-top{text-align:center;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.s-top b{font-size:17px;font-weight:700}
.s-top span{font-size:13px;color:var(--label2)}
.hud{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:114px}
.phase-word{font-size:46px;font-weight:300;letter-spacing:.2em;padding-left:.2em;line-height:1.2;background:linear-gradient(120deg,rgb(var(--b1)),rgb(var(--b2)));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.phase-word.pop2{animation:word .6s var(--spring)}
@keyframes word{from{opacity:0;transform:translateY(10px) scale(.9)}}
.phase-count{font-family:var(--f-num);font-size:24px;font-weight:600;color:var(--link);min-height:32px}
.s-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:80px}
.remain{font-size:15px;color:var(--label2)}
.round{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,rgb(var(--b1)),rgb(var(--b2)));box-shadow:0 12px 24px -10px rgb(var(--b1) / .7);transition:transform .35s var(--spring)}
.round:active{transform:scale(.9)}
.link{justify-self:end;color:var(--link);font-size:17px;min-height:44px;padding:0 4px}
.donebox{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-bottom:4px}
.tick{width:64px;height:64px;margin-bottom:4px}
.tick circle{fill:rgb(var(--c1) / .18);stroke:rgb(var(--b1));stroke-width:3;stroke-linecap:round;stroke-dasharray:176;stroke-dashoffset:176;animation:dash .8s .1s var(--smooth) forwards}
.tick path{fill:none;stroke:rgb(var(--b1));stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:dash .5s .65s var(--smooth) forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.donebox h2{font-size:34px;font-weight:800;letter-spacing:.02em;animation:word .7s .2s var(--spring) backwards}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.chip{background:var(--cell);border-radius:999px;padding:6px 14px;font-size:14px;box-shadow:0 1px 0 var(--sep)}
.chip b{font-family:var(--f-num);font-weight:700}
.donebox .btns{width:100%;display:flex;flex-direction:column;gap:4px;margin-top:14px}
.btn-plain{min-height:50px;color:var(--link);font-size:17px;font-weight:600}
.session.done .run{display:none}
.session:not(.done) .donebox{display:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-height:640px){
  .orb-stage{min-height:130px}
  .h-name{font-size:26px}
  .greet b{font-size:22px}
}
</style>
</head>
<body>
<div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>

<section id="home" class="layer home" aria-label="主界面">
  <div class="h-top rise">
    <div class="greet"><b id="gHi"></b><span id="gSub"></span></div>
    <button class="glass" data-act="lib" aria-label="呼吸方式与设置">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.6" cy="6" r="1" fill="currentColor"/><circle cx="4.6" cy="12" r="1" fill="currentColor"/><circle cx="4.6" cy="18" r="1" fill="currentColor"/></svg>
    </button>
  </div>
  <div id="homeWrap" class="orb-stage rise" style="--d:90ms"><canvas id="homeOrb" aria-hidden="true"></canvas></div>
  <div class="h-info rise" style="--d:180ms">
    <button class="h-name" data-act="lib" aria-label="选择呼吸方式"><span id="hName"></span><svg width="12" height="12" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l8 8-8 8"/></svg></button>
    <p id="hTag" class="h-tag"></p>
    <p id="hMeta" class="cap num"></p>
  </div>
  <div id="hSeg" class="seg rise" style="--d:250ms" role="group" aria-label="时长"></div>
  <button class="cta rise" style="--d:320ms" data-act="start">开始</button>
  <p id="hStat" class="h-stat"></p>
</section>

<section id="lib" class="layer lib" inert aria-label="呼吸方式与设置">
  <nav class="nav">
    <button class="nav-back" data-act="back"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>返回</button>
    <h2 class="nav-title">呼吸方式</h2>
    <span></span>
  </nav>
  <div id="libBody" class="scroll"></div>
</section>

<section id="session" class="layer session" inert role="dialog" aria-label="呼吸练习">
  <div class="s-top"><b id="sName"></b><span id="sRatio" class="num"></span></div>
  <div id="orbWrap" class="orb-stage"><canvas id="orb" aria-hidden="true"></canvas></div>
  <div class="hud run">
    <div id="phaseWord" class="phase-word" aria-live="polite">准备</div>
    <div id="phaseCount" class="phase-count">3</div>
    <div id="cycleInfo" class="cap"></div>
  </div>
  <div class="s-bottom run">
    <span id="remain" class="num remain">00:00</span>
    <button id="btnPause" class="round" data-act="pause" aria-label="暂停"></button>
    <button class="link" data-act="end">结束</button>
  </div>
  <div class="donebox">
    <svg class="tick" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28"/><path d="M20 33l8 8 17-18"/></svg>
    <p id="dEyebrow" class="cap"></p>
    <h2 id="dTitle"></h2>
    <p id="dSub" class="cap"></p>
    <div id="dChips" class="chips"></div>
    <div class="btns">
      <button class="cta" data-act="again">再练一次</button>
      <button class="btn-plain" data-act="finishclose">完成</button>
    </div>
  </div>
</section>

<script>

function phasesOf(t){return t.id==='custom'?mk(S.custom.i,S.custom.h,S.custom.o,S.custom.r):t.phases}
function cycleLen(ph){var a=0;ph.forEach(function(p){a+=p.secs});return a}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function bpmOf(ph){return Math.round(60/cycleLen(ph)*10)/10}
function metaOf(ph){return ph.map(function(p){return SHORT[p.label]+' '+fmt(p.secs)}).join(' · ')}

function levelOf(p,f){return (p.k==='in'||p.k==='out')?p.from+(p.to-p.from)*ease(f):p.to}
function locate(ph,tc){

function pad2(n){return n<10?'0'+n:''+n}

function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function waveSVG(ph,w,h,pad){
  var L=cycleLen(ph),a=0,pts=[];
  ph.forEach(function(p){
    var moving=(p.k==='in'||p.k==='out'),n=moving?16:2;
    for(var j=0;j<=n;j++){var f=j/n;pts.push([(a+p.secs*f)/L*w,h-pad-levelOf(p,f)*(h-2*pad)])}

/* ===== 配色：切换方式时颜色平滑过渡 ===== */
function lerp(a,b,t){return a+(b-a)*t}
function lerpC(a,b,t){return [Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t))]}

/* ===== 光球 ===== */
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function mixW(c,w){return [Math.round(c[0]+(255-c[0])*w),Math.round(c[1]+(255-c[1])*w),Math.round(c[2]+(255-c[2])*w)]}
function Orb(cv,wrap){
  this.cv=cv;this.wrap=wrap;this.ctx=cv.getContext('2d');this.w=0;this.h=0;
  this.a=[.4,0,1,false,0];this.last=0;this.rip=[];this.sparks=[];
  this.parts=[];
  for(var i=0;i<22;i++)this.parts.push({a:Math.random()*6.283,d:1.18+Math.random()*.8,sp:(Math.random()-.5)*.28,sz:1.4+Math.random()*2.6,ph:Math.random()*6.283});
}
Orb.prototype.size=function(){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  this.w=this.wrap.clientWidth;this.h=this.wrap.clientHeight;
  this.cv.width=Math.max(1,Math.round(this.w*dpr));this.cv.height=Math.max(1,Math.round(this.h*dpr));
  this.ctx.setTransform(dpr,0,0,dpr,0,0);
  this.draw.apply(this,this.a);
};
Orb.prototype.pulse=function(dir){this.rip.push({age:0,dir:dir});if(this.rip.length>4)this.rip.shift()};
Orb.prototype.burst=function(){
  var cols=[CUR.c1,CUR.c2,[255,255,255],[255,214,102],mixW(CUR.c2,.5)];
  for(var i=0;i<80;i++){
    var an=Math.random()*6.283,sp=120+Math.random()*320;
    this.sparks.push({x:0,y:0,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-80,life:1,dec:.45+Math.random()*.5,sz:2+Math.random()*3.6,c:cols[i%cols.length]});
  }
};
Orb.prototype.draw=function(lv,pg,dim,ring,now){
  this.a=[lv,pg,dim,ring,now];
  var dt=this.last?Math.min(.05,(now-this.last)/1000):0;this.last=now;
  var t=now/1000,ctx=this.ctx,cw=this.w,ch=this.h;
  ctx.clearRect(0,0,cw,ch);
  ctx.globalAlpha=dim;
  var cx=cw/2,cy=ch/2,Rm=Math.min(cw,ch)/2,R=Rm*.56,r=R*(.5+.5*lv);
  var m=lerpC(CUR.c1,CUR.c2,lv),i,g;
  /* 光晕 */
  g=ctx.createRadialGradient(cx,cy,r*.3,cx,cy,r*2.2);
  g.addColorStop(0,rgba(m,.42));g.addColorStop(1,rgba(m,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*2.2,0,6.283);ctx.fill();
  /* 漂浮的小光点 */
  for(i=0;i<this.parts.length;i++){
    var p=this.parts[i],an=p.a+t*p.sp,dist=r*(p.d+.07*Math.sin(t*.8+p.ph)+.22*lv);
    var al=.22+.4*Math.pow(Math.sin(t*1.3+p.ph),2);
    ctx.fillStyle=rgba(i%2?CUR.c2:CUR.c1,al);
    ctx.beginPath();ctx.arc(cx+Math.cos(an)*dist,cy+Math.sin(an)*dist*.94,p.sz,0,6.283);ctx.fill();
  }
  /* 涟漪 */
  for(i=this.rip.length-1;i>=0;i--){
    var rp=this.rip[i];rp.age+=dt;
    var k=rp.age/2.4;
    if(k>=1){this.rip.splice(i,1);continue}
    var rr=rp.dir==='in'?r*(1.04+.95*k):r*(2-.95*k);
    ctx.strokeStyle=rgba(m,(1-k)*.5);ctx.lineWidth=2.2;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,6.283);ctx.stroke();
  }
  /* 外圈 */
  [1.14,1.3].forEach(function(kk,j){
    ctx.beginPath();ctx.arc(cx,cy,r*(kk+.012*Math.sin(t*1.6+j)),0,6.283);
    ctx.strokeStyle=rgba(m,.3-.12*j);ctx.lineWidth=1.6;ctx.stroke();
  });
  /* 球体：底色渐变 + 三团流动的色块 + 高光 */
  ctx.save();
  ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.clip();
  var ga=t*.22;
  g=ctx.createLinearGradient(cx+Math.cos(ga)*r,cy+Math.sin(ga)*r,cx-Math.cos(ga)*r,cy-Math.sin(ga)*r);
  g.addColorStop(0,rgba(mixW(CUR.c1,.28),1));g.addColorStop(1,rgba(CUR.c2,1));
  ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,2*r,2*r);
  var blobs=[[CUR.c2,.7],[CUR.c1,.62],[[255,255,255],.34]];
  for(i=0;i<3;i++){
    var ang=t*(.55+.22*i)+i*2.1,bx=cx+Math.cos(ang)*r*.46,by=cy+Math.sin(ang*1.13)*r*.46,rad=r*(.74-.08*i);
    g=ctx.createRadialGradient(bx,by,0,bx,by,rad);
    g.addColorStop(0,rgba(blobs[i][0],blobs[i][1]));g.addColorStop(1,rgba(blobs[i][0],0));
    ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,2*r,2*r);
  }
  g=ctx.createRadialGradient(cx-r*.36,cy-r*.42,0,cx-r*.36,cy-r*.42,r*.55);
  g.addColorStop(0,'rgba(255,255,255,.62)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(cx-r,cy-r,2*r,2*r);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.stroke();
  /* 进度环 */
  if(ring){
    var rr2=Rm*.93,a0=-Math.PI/2,a1=a0+6.283*pg;
    ctx.lineWidth=4;ctx.lineCap='round';
    ctx.strokeStyle=rgba(m,.2);ctx.beginPath();ctx.arc(cx,cy,rr2,0,6.283);ctx.stroke();
    if(pg>.002){ctx.strokeStyle=rgba(CUR.b1,.95);ctx.beginPath();ctx.arc(cx,cy,rr2,a0,a1);ctx.stroke()}
    ctx.fillStyle=rgba(CUR.b2,1);ctx.beginPath();ctx.arc(cx+rr2*Math.cos(a1),cy+rr2*Math.sin(a1),6,0,6.283);ctx.fill();
  }
  /* 庆祝的彩屑 */
  for(i=this.sparks.length-1;i>=0;i--){
    var s=this.sparks[i];
    s.life-=s.dec*dt;
    if(s.life<=0){this.sparks.splice(i,1);continue}
    s.vy+=300*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;
    ctx.fillStyle=rgba(s.c,Math.min(1,s.life*1.4));
    ctx.beginPath();ctx.arc(cx+s.x,cy+s.y,s.sz,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
};

        var FEM=/xiaoxiao|xiaoyi|xiaohan|xiaomeng|huihui|yaoyao|ting-?ting|mei-?jia|sin-?ji|female|女|婷|晓/i;
        var MALE=/yunxi|yunyang|yunjian|kangkang|male|男/i;
        var vs=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)&&!/HK|yue/i.test(v.lang+v.name)});
        vs.sort(function(a,b){
          var sa=(FEM.test(a.name)?0:MALE.test(a.name)?2:1),sb=(FEM.test(b.name)?0:MALE.test(b.name)?2:1);
          return sa-sb||(a.localService===b.localService?0:a.localService?-1:1);
        });
        vs.forEach(function(v){out.push({name:v.name,label:v.name.replace(/^(Microsoft|Google|Apple)\s+/,'')})});
      }
    }catch(e){}
    if(out.length||!this.list.length)this.list=out;
    return this.list;
  },
  available:function(){return !!window.TunaVoice||('speechSynthesis' in window)},
  current:function(){
    var l=this.list;

    return l[0]||null;
  },
  speak:function(text){

        speechSynthesis.cancel();

        u.lang='zh-CN';u.rate=.8;u.pitch=1.14;u.volume=.9;
        if(cur){var vs=speechSynthesis.getVoices();for(var i=0;i<vs.length;i++)if(vs[i].name===cur.name){u.voice=vs[i];break}}

    }catch(e){}
  },
  stop:function(){

    }catch(e){}
  }
};

var AC=null;
function ensureAudio(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
}
function tone(f0,f1,dur,vol,delay){
  if(!AC)return;
  try{
    var t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.setValueAtTime(f0,t0);o.frequency.linearRampToValueAtTime(f1,t0+dur);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+Math.min(.5,dur*.3));g.gain.linearRampToValueAtTime(0,t0+dur);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.05);
  }catch(e){}
}
function bell(f,delay){tone(f,f,1.7,.05,delay);tone(f*2.01,f*2.01,1.1,.018,delay)}
function pitch(l){return 260+170*l}
function buzz(ms){if(S.haptic&&navigator.vibrate){try{navigator.vibrate(ms)}catch(e){}}}
var wl=null;

function lockOff(){try{if(wl)wl.release()}catch(e){}wl=null}

/* ===== 练习 ===== */
var raf=0;
var H={word:$('#phaseWord'),count:$('#phaseCount'),cycle:$('#cycleInfo'),remain:$('#remain')};
var ICON_PAUSE='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.3"/><rect x="14" y="5" width="4" height="14" rx="1.3"/></svg>';
var ICON_PLAY='<svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
function setText(el,v){if(el.textContent!==v)el.textContent=v}

function sayFor(s,loc,ci){
  var p=loc.p,txt=(ci===0&&p.say1)?p.say1:(p.say||p.label);
  if(s.cycles>1&&ci===s.cycles-1&&loc.i===0)txt='最后一轮，'+txt;
  else if(p.k==='out'&&ci>0&&(ci+1)%3===0)txt=txt+'，'+TIPS[Math.floor(ci/3)%TIPS.length];
  return txt;
}
function cue(s,loc,ci){
  var p=loc.p;
  if(S.sound&&AC){
    if(p.k==='in'||p.k==='out')tone(pitch(p.from),pitch(p.to),Math.min(p.secs,7)*.95,.07);
    else bell(p.k==='hold'?660:440);
  }
  buzz(p.k==='hold'||p.k==='rest'?8:14);
  if(p.k==='in'&&p.from===0)sessOrb.pulse('in');
  else if(p.k==='out')sessOrb.pulse('out');
  if(S.voice)Voice.speak(sayFor(s,loc,ci));
}
function startSession(){
  var t=techById(S.tid),pl=plan(t);
  ensureAudio();lockOn();
  var prep=(S.voice&&Voice.available())?6:3;
  S.sess={t:t,ph:pl.ph,L:pl.L,cycles:pl.cycles,total:pl.total,elapsed:0,last:performance.now(),paused:false,prep:prep,key:-2,lv:0,pg:0};
  if(S.h===0)pushH();
  S.view='session';
  var ses=$('#session');
  ses.classList.remove('done');ses.classList.add('on');setInert(ses,false);
  setInert($('#home'),true);setInert($('#lib'),true);
  $('#sName').textContent=t.name;
  $('#sRatio').textContent=metaOf(pl.ph)+' 秒';
  $('#btnPause').innerHTML=ICON_PAUSE;$('#btnPause').setAttribute('aria-label','暂停');
  H.word.textContent='准备';H.count.textContent=String(prep);H.cycle.textContent='放松肩膀，轻轻闭上眼';
  H.remain.textContent=mmss(pl.total);
  sessOrb.size();
  cancelAnimationFrame(raf);
  if(S.voice)Voice.speak(INTRO);
  S.sess.last=performance.now();
  raf=requestAnimationFrame(frame);
}
function frame(now){
  var s=S.sess;
  if(!s||S.view!=='session')return;
  var dt=now-s.last;s.last=now;
  if(dt>100)dt=100;
  if(!s.paused)s.elapsed+=dt;
  var t=s.elapsed/1000-s.prep,lv=0,pg=0,word,count,cyc,key,loc=null,ci=0;
  if(t<0){
    word='准备';count=String(Math.ceil(-t));pg=s.elapsed/1000/s.prep;key=-1;cyc='放松肩膀，轻轻闭上眼';
  }else if(t>=s.total){
    finish(true);return;
  }else{
    ci=Math.floor(t/s.L);var tc=t-ci*s.L;loc=locate(s.ph,tc);
    lv=loc.lv;pg=loc.f;word=loc.p.label;count=String(Math.max(1,Math.ceil(loc.rem-1e-6)));
    key=ci*100+loc.i;cyc='第 '+(ci+1)+' / '+s.cycles+' 轮';
    if(key!==s.key)cue(s,loc,ci);
  }
  if(key!==s.key){
    s.key=key;H.word.textContent=word;
    H.word.classList.remove('pop2');void H.word.offsetWidth;H.word.classList.add('pop2');
  }
  setText(H.count,count);setText(H.cycle,cyc);
  setText(H.remain,mmss(t<0?s.total:s.total-t));
  s.lv=lv;s.pg=pg;
  sessOrb.draw(lv,pg,s.paused?.55:1,true,now);
  raf=requestAnimationFrame(frame);
}
function setPaused(p){
  var s=S.sess;if(!s||s.paused===p)return;
  s.paused=p;s.last=performance.now();
  $('#btnPause').innerHTML=p?ICON_PLAY:ICON_PAUSE;
  $('#btnPause').setAttribute('aria-label',p?'继续':'暂停');
  try{if(AC)p?AC.suspend():AC.resume()}catch(e){}
  if(p)Voice.stop();
}
function doneLoop(now){
  if(S.view!=='session'||S.sess||!$('#session').classList.contains('done'))return;
  sessOrb.draw(.62+.08*Math.sin(now/700),0,1,false,now);
  raf=requestAnimationFrame(doneLoop);
}
function closeSession(){
  cancelAnimationFrame(raf);Voice.stop();
  var ses=$('#session');
  ses.classList.remove('on','done');setInert(ses,true);
  S.view='home';
  setInert($('#home'),false);
  renderHome(false);startHome();
}
function finish(complete){
  var s=S.sess;if(!s)return;
  cancelAnimationFrame(raf);lockOff();Voice.stop();
  var breath=Math.max(0,Math.min(s.total,s.elapsed/1000-s.prep));
  var secs=complete?s.total:Math.round(breath);
  var cycles=complete?s.cycles:Math.floor(breath/s.L);
  S.sess=null;
  if(complete&&S.sound&&AC){try{AC.resume()}catch(e){}bell(523);bell(784,.45)}
  if(complete)buzz(30);
  if(secs>=30){
    DB.logs.push({d:ymd(new Date()),s:secs,k:s.t.id});
    if(DB.logs.length>400)DB.logs=DB.logs.slice(-400);
    saveDB();
    var st=stats();
    $('#dEyebrow').textContent=complete?'练习完成':'提前结束';
    $('#dTitle').textContent=(complete?'完成了 ':'练习了 ')+cycles+' 轮';
    $('#dSub').textContent=s.t.name+' · 用时 '+mmss(secs);
    $('#dChips').innerHTML='<span class="chip">连续 <b>'+st.streak+'</b> 天</span><span class="chip">本周 <b>'+st.weekMin+'</b> 分钟</span>';
    $('#session').classList.add('done');
    if(complete&&S.voice)setTimeout(function(){Voice.speak(OUTRO)},400);
    sessOrb.burst();
    raf=requestAnimationFrame(doneLoop);
  }else{
    closeSession();
    if(S.h>0){S.suppress=true;try{history.back()}catch(e){S.suppress=false}}
  }
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&S.sess&&!S.sess.paused)setPaused(true);
});
document.addEventListener('keydown',function(e){
  if(S.view==='session'&&S.sess&&(e.key===' '||e.code==='Space')){e.preventDefault();setPaused(!S.sess.paused)}
  else if(e.key==='Escape')back();
});

  }
  else if(a==='vopen'){S.voiceOpen=!S.voiceOpen;Voice.load();keepFocus(renderLib)}
  else if(a==='voice'){S.voiceName=b.dataset.name;savePrefs();Voice.speak('放松肩膀，我们慢慢开始。');keepFocus(renderLib)}
  else if(a==='step'){
    var key=b.dataset.k,d=+b.dataset.d,min=(key==='i'||key==='o')?1:0,max=(key==='i'||key==='o')?10:6;
    S.custom[key]=Math.max(min,Math.min(max,S.custom[key]+d));savePrefs();keepFocus(renderLib);renderHome(false);
  }
  else if(a==='start'){if(S.view==='home')startSession()}
  else if(a==='again'){startSession()}
  else if(a==='pause'){if(S.sess)setPaused(!S.sess.paused)}
  else if(a==='end'){back()}
  else if(a==='finishclose'){back()}
});

/* ===== 启动 ===== */
buildSeg();
renderHome(false);
sizeAll();
startHome();
})();
</script>

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
