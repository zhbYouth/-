<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="吐纳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>吐纳</title>
<style>
:root{
  /* 版式：两层界面。第一层只有光球、方式名、时长和开始；第二层是方式列表、设置与记录；练习为全屏覆盖层。风格参照 iOS：分组列表、分段控件、毛玻璃按钮、系统字体。 */
  color-scheme:light;
  --bg:#f2f2f7;
  --cell:#ffffff;
  --label:#000000;
  --label2:rgb(60 60 67 / .64);
  --sep:rgb(60 60 67 / .16);
  --fill:rgb(118 118 128 / .13);
  --fill-strong:rgb(120 120 128 / .18);
  --seg-on:#ffffff;
  --tint:#08877e;
  --tint-ink:#ffffff;
  --orb:22 158 146;
  --glass:rgb(255 255 255 / .66);
  --nav:rgb(249 249 249 / .82);
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--cell:#1c1c1e;--label:#ffffff;--label2:rgb(235 235 245 / .62);--sep:rgb(84 84 88 / .55);
    --fill:rgb(118 118 128 / .26);--fill-strong:rgb(120 120 128 / .36);--seg-on:#636366;
    --tint:#64e3d6;--tint-ink:#00211e;--orb:100 226 214;--glass:rgb(58 58 60 / .6);--nav:rgb(22 22 24 / .82);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--cell:#1c1c1e;--label:#ffffff;--label2:rgb(235 235 245 / .62);--sep:rgb(84 84 88 / .55);
  --fill:rgb(118 118 128 / .26);--fill-strong:rgb(120 120 128 / .36);--seg-on:#636366;
  --tint:#64e3d6;--tint-ink:#00211e;--orb:100 226 214;--glass:rgb(58 58 60 / .6);--nav:rgb(22 22 24 / .82);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--label);font-family:var(--f-ui);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.layer{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
.glass{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--sep)}

/* ---------- 第一层：主界面 ---------- */
.home{gap:14px;padding:calc(var(--sat) + 10px) max(20px,var(--sar)) calc(var(--sab) + 18px) max(20px,var(--sal));transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s}
.home.pushed{transform:translateX(-26%);opacity:.55}
.h-top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.greet{font-size:17px;font-weight:600;color:var(--label2)}
.orb-stage{flex:1;min-height:180px;position:relative}
.orb-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.h-info{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.h-name{display:inline-flex;align-items:center;gap:4px;font-size:30px;font-weight:700;letter-spacing:.02em;line-height:1.2;min-height:44px;padding:0 8px}
.h-name svg{color:var(--label2);flex:none;margin-top:3px}
.cap{font-size:15px;color:var(--label2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px}
.seg button{min-height:32px;border-radius:8px;font-size:13px;font-weight:500;transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:0 1px 3px rgb(0 0 0 / .14);font-weight:600}
.cta{width:100%;min-height:56px;border-radius:999px;background:var(--tint);color:var(--tint-ink);font-size:18px;font-weight:600;letter-spacing:.1em}
.cta:active{transform:scale(.985);opacity:.9}
.h-stat{text-align:center;min-height:20px;font-size:13px;color:var(--label2)}

/* ---------- 第二层：方式与设置 ---------- */
.lib{z-index:10;transform:translateX(100%);visibility:hidden;box-shadow:-10px 0 30px rgb(0 0 0 / .14);transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s .4s}
.lib.open{transform:none;visibility:visible;transition:transform .4s cubic-bezier(.2,.8,.2,1),visibility 0s}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:calc(var(--sat) + 2px) max(8px,var(--sar)) 4px max(8px,var(--sal));min-height:calc(var(--sat) + 48px);background:var(--nav);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-bottom:.5px solid var(--sep);z-index:2}
.nav-back{display:inline-flex;align-items:center;gap:2px;color:var(--tint);font-size:17px;min-height:44px;padding:0 8px;justify-self:start}
.nav-title{font-size:17px;font-weight:600}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px max(16px,var(--sar)) calc(var(--sab) + 36px) max(16px,var(--sal));display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:7px}
.gh{font-size:13px;color:var(--label2);padding:0 16px;letter-spacing:.02em}
.gf{font-size:13px;color:var(--label2);padding:0 16px;line-height:1.5}
.group{background:var(--cell);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;text-align:left;position:relative}
.row+.row::before,.cellt+.cellt::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
button.row:active{background:var(--fill)}
.r-main{flex:1;min-width:0;display:flex;flex-direction:column}
.r-name{font-size:17px;font-weight:500}
.r-sub{font-size:13px;color:var(--label2);line-height:1.45}
.r-wave{width:58px;flex:none;aspect-ratio:120/44}
.r-wave svg{width:100%;height:100%;display:block;overflow:visible}
.r-check{width:22px;height:22px;flex:none;color:var(--tint);display:grid;place-items:center}
.cellt{position:relative;padding:12px 16px;font-size:15px;line-height:1.55;display:flex;flex-direction:column;gap:2px}
.cellt .k{font-size:13px;color:var(--label2)}
.wave{position:relative;width:100%;aspect-ratio:320/96}
.wave svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wave-line{fill:none;stroke:var(--tint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.wave-area{fill:rgb(var(--orb) / .16);stroke:none}
.r-wave .wave-line{stroke-width:1.8}
.wavebox{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
.pcs{display:flex;flex-wrap:wrap;gap:6px}
.pc{display:flex;align-items:baseline;gap:6px;background:var(--fill);border-radius:8px;padding:4px 10px;font-size:13px}
.pc b{font-family:var(--f-num);font-weight:600}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{min-width:34px;text-align:right;font-family:var(--f-num);font-weight:500;font-size:17px}
.pm{display:flex;background:var(--fill);border-radius:9px;overflow:hidden}
.pm button{width:46px;height:32px;font-size:21px;line-height:1;color:var(--tint)}
.pm button+button{border-left:.5px solid var(--sep)}
.pm button:disabled{opacity:.3;cursor:default}
.r-spacer{flex:1}
.sw{width:51px;height:31px;border-radius:999px;background:var(--fill-strong);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgb(0 0 0 / .28);transition:transform .25s}
.sw[aria-checked="true"]{background:var(--tint)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:88px;padding:14px 16px 0}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar i{display:block;width:100%;max-width:26px;border-radius:7px;background:var(--fill);min-height:4px}
.bar.has i{background:rgb(var(--orb) / .7)}
.bar.today i{background:var(--tint)}
.bar span{font-size:12px;color:var(--label2)}
.bar.today span{color:var(--label);font-weight:600}
.statline{padding:12px 16px 14px;font-size:15px;color:var(--label2)}
.statline b{color:var(--label);font-family:var(--f-num);font-weight:600}

/* ---------- 练习（全屏覆盖） ---------- */
.session{z-index:20;gap:6px;padding:calc(var(--sat) + 8px) max(20px,var(--sar)) calc(var(--sab) + 18px) max(20px,var(--sal));opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s;background:radial-gradient(110% 70% at 50% 36%,rgb(var(--orb) / .16),transparent 70%),var(--bg)}
.session.on{opacity:1;visibility:visible;transition:opacity .3s,visibility 0s}
.s-top{text-align:center;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.s-top b{font-size:17px;font-weight:600}
.s-top span{font-size:13px;color:var(--label2)}
.hud{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:112px}
.phase-word{font-size:44px;font-weight:300;letter-spacing:.2em;padding-left:.2em;line-height:1.2}
.phase-word.pop{animation:pop .5s ease-out}
@keyframes pop{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.phase-count{font-family:var(--f-num);font-size:22px;color:var(--tint);min-height:30px}
.s-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:76px}
.remain{font-size:15px;color:var(--label2)}
.round{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--sep)}
.link{justify-self:end;color:var(--tint);font-size:17px;min-height:44px;padding:0 4px}
.donebox{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;padding-bottom:4px}
.donebox h2{font-size:34px;font-weight:700;letter-spacing:.02em}
.donebox .btns{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:14px}
.btn-plain{min-height:50px;color:var(--tint);font-size:17px;font-weight:500}
.session.done .run{display:none}
.session:not(.done) .donebox{display:none}

@media (prefers-reduced-motion:reduce){
  .home,.lib,.session,.sw,.sw::after,.seg button{transition:none}
  .phase-word.pop{animation:none}
}
@media (max-height:640px){
  .orb-stage{min-height:140px}
  .h-name{font-size:26px}
}
</style>

</head>
<body>
<section id="home" class="layer home" aria-label="主界面">
  <div class="h-top">
    <span id="greet" class="greet"></span>
    <button class="glass" data-act="lib" aria-label="呼吸方式与设置">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.6" cy="6" r="1" fill="currentColor"/><circle cx="4.6" cy="12" r="1" fill="currentColor"/><circle cx="4.6" cy="18" r="1" fill="currentColor"/></svg>
    </button>
  </div>
  <div id="homeWrap" class="orb-stage"><canvas id="homeOrb" aria-hidden="true"></canvas></div>
  <div class="h-info">
    <button class="h-name" data-act="lib" aria-label="选择呼吸方式"><span id="hName"></span><svg width="12" height="12" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l8 8-8 8"/></svg></button>
    <p id="hMeta" class="cap num"></p>
  </div>
  <div id="hSeg" class="seg" role="group" aria-label="时长"></div>
  <button class="cta" data-act="start">开始</button>
  <p id="hStat" class="h-stat"></p>
</section>

<section id="lib" class="layer lib" inert aria-label="呼吸方式与设置">
  <nav class="nav">
    <button class="nav-back" data-act="back"><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>返回</button>
    <h2 class="nav-title">呼吸方式</h2>
    <span></span>
  </nav>
  <div id="libBody" class="scroll"></div>
</section>

<section id="session" class="layer session" inert role="dialog" aria-label="呼吸练习">
  <div class="s-top"><b id="sName"></b><span id="sRatio" class="num"></span></div>
  <div id="orbWrap" class="orb-stage"><canvas id="orb" aria-hidden="true"></canvas></div>
  <div class="hud run">
    <div id="phaseWord" class="phase-word" aria-live="polite">准备</div>
    <div id="phaseCount" class="phase-count">3</div>
    <div id="cycleInfo" class="cap"></div>
  </div>
  <div class="s-bottom run">
    <span id="remain" class="num remain">00:00</span>
    <button id="btnPause" class="round" data-act="pause" aria-label="暂停"></button>
    <button class="link" data-act="end">结束</button>
  </div>
  <div class="donebox">
    <p id="dEyebrow" class="cap"></p>
    <h2 id="dTitle"></h2>
    <p id="dSub" class="cap"></p>
    <div class="btns">
      <button class="cta" data-act="again">再练一次</button>
      <button class="btn-plain" data-act="finishclose">完成</button>
    </div>
  </div>
</section>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var root=document.documentElement;

/* ===== 刘海与状态栏：Android 外壳会把安全区尺寸传进来 ===== */
function setInsets(t,r,b,l){
  root.style.setProperty('--sat',t+'px');root.style.setProperty('--sar',r+'px');
  root.style.setProperty('--sab',b+'px');root.style.setProperty('--sal',l+'px');
  sizeAll();
}
window.__setInsets=setInsets;
try{
  if(window.TunaInsets){
    var ip=String(window.TunaInsets.get()).split(',').map(Number);
    if(ip.length===4&&ip.every(isFinite)){
      root.style.setProperty('--sat',ip[0]+'px');root.style.setProperty('--sar',ip[1]+'px');
      root.style.setProperty('--sab',ip[2]+'px');root.style.setProperty('--sal',ip[3]+'px');
    }
  }
}catch(e){}

/* ===== 数据 ===== */
function mk(i,h,o,r){
  var p=[{k:'in',label:'吸气',secs:i,from:0,to:1}];
  if(h>0)p.push({k:'hold',label:'屏息',secs:h,from:1,to:1});
  p.push({k:'out',label:'呼气',secs:o,from:1,to:0});
  if(r>0)p.push({k:'rest',label:'停留',secs:r,from:0,to:0});
  return p;
}
var TECH=[
  {id:'box',name:'箱式呼吸',goals:['focus','relax'],phases:mk(4,4,4,4),
   blurb:'四个等长的阶段，节奏稳定，适合想保持清醒又想放松的时刻。',
   how:'鼻吸 4 秒，屏息 4 秒，缓慢呼出 4 秒，再停 4 秒。',when:'适合：开会前、专注工作前、压力上来时'},
  {id:'s478',name:'4-7-8 呼吸',goals:['sleep','relax'],phases:mk(4,7,8,0),
   blurb:'呼气是吸气的两倍，节奏偏慢，常用于睡前放松。',
   how:'鼻吸 4 秒，屏息 7 秒，用嘴缓慢呼出 8 秒。',when:'适合：睡前、夜里醒来后',
   note:'屏息较长，第一次练习建议控制在 3 分钟以内。'},
  {id:'coherent',name:'共振呼吸',goals:['relax','focus'],phases:mk(5.5,0,5.5,0),
   blurb:'每分钟约 5.5 次，吸呼等长、不停顿，节奏平稳连贯。',
   how:'鼻吸 5.5 秒，不屏息，轻轻呼出 5.5 秒。',when:'适合：日常放松、通勤路上、工作间隙'},
  {id:'sigh',name:'生理叹息',goals:['relax'],
   phases:[{k:'in',label:'吸气',secs:2,from:0,to:.78},{k:'in',label:'再吸一口',secs:1,from:.78,to:1},{k:'out',label:'呼气',secs:6,from:1,to:0}],
   blurb:'两次短吸、一次长呼，一轮约 9 秒，用来快速松下来。',
   how:'鼻吸一口，不呼气再补一小口，然后用嘴慢慢呼尽。',when:'适合：突然紧张、情绪起伏时，1 到 3 分钟即可'},
  {id:'r46',name:'4-6 放松呼吸',goals:['relax','sleep'],phases:mk(4,0,6,0),
   blurb:'呼气比吸气长，是最容易上手的放松节奏。',
   how:'鼻吸 4 秒，缓慢呼出 6 秒，肩膀自然下沉。',when:'适合：初学者、午休后、回家路上'},
  {id:'wake',name:'唤醒呼吸',goals:['energy'],phases:mk(2,0,2,0),
   blurb:'短促均匀的快节奏，用来提神。',
   how:'鼻吸 2 秒，鼻呼 2 秒，胸腹轻松起伏。',when:'适合：上午困倦、午后犯困',
   note:'节奏较快，感到头晕就停下，恢复自然呼吸。'},
  {id:'custom',name:'自定义节奏',goals:[],phases:null,
   blurb:'自己调整吸、屏、呼、停的秒数。',
   how:'在下方设定每个阶段的秒数，波形会同步变化。',when:'适合：已经找到自己舒服的节奏'}
];
var GOALS=[['all','全部'],['relax','放松'],['focus','专注'],['sleep','助眠'],['energy','活力']];
var GNAME={relax:'放松',focus:'专注',sleep:'助眠',energy:'活力'};
var SHORT={'吸气':'吸','再吸一口':'吸','屏息':'屏','呼气':'呼','停留':'停'};
var WD=['日','一','二','三','四','五','六'];

/* ===== 状态与存储 ===== */
var KEY='tuna.v1';
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
var DB=loadDB();DB.logs=Array.isArray(DB.logs)?DB.logs:[];DB.prefs=DB.prefs||{};
var P=DB.prefs;
function techById(id){for(var i=0;i<TECH.length;i++)if(TECH[i].id===id)return TECH[i];return null}
function dayPart(){
  var h=new Date().getHours();
  if(h>=5&&h<10)return {g:'早上好',id:'wake'};
  if(h>=10&&h<17)return {g:'下午好',id:'box'};
  if(h>=17&&h<21)return {g:'晚上好',id:'coherent'};
  return {g:h<5?'夜深了':'晚上好',id:'s478'};
}
var DP=dayPart();
if(new Date().getHours()>=5&&new Date().getHours()<12)DP.g='早上好';
else if(new Date().getHours()>=12&&new Date().getHours()<14)DP.g='中午好';
var S={view:'home',goal:'all',h:0,suppress:false,
  tid:(P.tid&&techById(P.tid))?P.tid:DP.id,
  mins:[1,3,5,10].indexOf(P.mins)>=0?P.mins:3,
  sound:P.sound!==false,voice:P.voice===true,haptic:P.haptic!==false,
  custom:P.custom||{i:4,h:2,o:6,r:0},sess:null,last:null};
function savePrefs(){DB.prefs={tid:S.tid,mins:S.mins,sound:S.sound,voice:S.voice,haptic:S.haptic,custom:S.custom};saveDB()}

/* ===== 工具 ===== */
function phasesOf(t){return t.id==='custom'?mk(S.custom.i,S.custom.h,S.custom.o,S.custom.r):t.phases}
function cycleLen(ph){var a=0;ph.forEach(function(p){a+=p.secs});return a}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function metaOf(ph){return ph.map(function(p){return SHORT[p.label]+' '+fmt(p.secs)}).join(' · ')}
function ease(f){return .5-.5*Math.cos(Math.PI*f)}
function levelOf(p,f){return (p.k==='in'||p.k==='out')?p.from+(p.to-p.from)*ease(f):p.to}
function locate(ph,tc){
  var a=0;
  for(var i=0;i<ph.length;i++){
    var p=ph[i];
    if(tc<a+p.secs||i===ph.length-1){
      var f=Math.min(1,Math.max(0,(tc-a)/p.secs));
      return {i:i,p:p,f:f,lv:levelOf(p,f),rem:p.secs-(tc-a)};
    }
    a+=p.secs;
  }
}
function plan(t){
  var ph=phasesOf(t),L=cycleLen(ph),cycles=Math.max(1,Math.round(S.mins*60/L));
  return {ph:ph,L:L,cycles:cycles,total:cycles*L};
}
function pad2(n){return n<10?'0'+n:''+n}
function mmss(s){s=Math.max(0,Math.ceil(s-1e-6));return pad2(Math.floor(s/60))+':'+pad2(s%60)}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function goalsText(t){return t.goals.length?t.goals.map(function(g){return GNAME[g]}).join(' · '):'自由调整'}

function waveSVG(ph,w,h,pad){
  var L=cycleLen(ph),a=0,pts=[];
  ph.forEach(function(p){
    var moving=(p.k==='in'||p.k==='out'),n=moving?16:2;
    for(var j=0;j<=n;j++){var f=j/n;pts.push([(a+p.secs*f)/L*w,h-pad-levelOf(p,f)*(h-2*pad)])}
    a+=p.secs;
  });
  var d='M'+pts.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('L');
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><path class="wave-area" d="'+d+'L'+w+' '+h+'L0 '+h+'Z"/><path class="wave-line" d="'+d+'"/></svg>';
}
function stats(){
  var map={};
  DB.logs.forEach(function(l){map[l.d]=(map[l.d]||0)+l.s});
  var today=new Date(),days=[],weekSecs=0,i;
  for(i=6;i>=0;i--){
    var d=new Date(today.getFullYear(),today.getMonth(),today.getDate()-i),k=ymd(d),s=map[k]||0;
    weekSecs+=s;days.push({k:k,s:s,wd:WD[d.getDay()],today:i===0});
  }
  var streak=0,c=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  if(!map[ymd(c)])c.setDate(c.getDate()-1);
  while(map[ymd(c)]){streak++;c.setDate(c.getDate()-1)}
  return {days:days,streak:streak,weekMin:Math.round(weekSecs/60),count:DB.logs.length};
}

/* ===== 光球 ===== */
var ORB=[22,158,146];
function refreshColors(){
  try{
    var v=getComputedStyle(root).getPropertyValue('--orb').trim().split(/\s+/).map(Number);
    if(v.length===3&&v.every(function(n){return !isNaN(n)}))ORB=v;
  }catch(e){}
}
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function mix(c,w){return [Math.round(c[0]+(255-c[0])*w),Math.round(c[1]+(255-c[1])*w),Math.round(c[2]+(255-c[2])*w)]}
function OrbView(cv,wrap){this.cv=cv;this.wrap=wrap;this.ctx=cv.getContext('2d');this.w=0;this.h=0;this.a=[0.4,0,1,false]}
OrbView.prototype.size=function(){
  var dpr=Math.min(2,window.devicePixelRatio||1);
  this.w=this.wrap.clientWidth;this.h=this.wrap.clientHeight;
  this.cv.width=Math.max(1,Math.round(this.w*dpr));this.cv.height=Math.max(1,Math.round(this.h*dpr));
  this.ctx.setTransform(dpr,0,0,dpr,0,0);
  this.draw.apply(this,this.a);
};
OrbView.prototype.draw=function(lv,pg,dim,ring){
  this.a=[lv,pg,dim,ring];
  var ctx=this.ctx,cw=this.w,ch=this.h;
  ctx.clearRect(0,0,cw,ch);
  ctx.globalAlpha=dim;
  var cx=cw/2,cy=ch/2,Rm=Math.min(cw,ch)/2,R=Rm*.56,r=R*(.5+.5*lv);
  var g=ctx.createRadialGradient(cx,cy,r*.2,cx,cy,r*1.95);
  g.addColorStop(0,rgba(ORB,.30));g.addColorStop(1,rgba(ORB,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*1.95,0,Math.PI*2);ctx.fill();
  [1.14,1.28,1.44].forEach(function(k,i){
    ctx.beginPath();ctx.arc(cx,cy,r*k,0,Math.PI*2);
    ctx.strokeStyle=rgba(ORB,.26-.07*i);ctx.lineWidth=1.5;ctx.stroke();
  });
  var cg=ctx.createRadialGradient(cx-r*.28,cy-r*.32,r*.08,cx,cy,r);
  cg.addColorStop(0,rgba(mix(ORB,.55),.95));cg.addColorStop(.55,rgba(ORB,.8));cg.addColorStop(1,rgba(ORB,.44));
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  if(ring){
    var rr=Rm*.92,a0=-Math.PI/2,a1=a0+Math.PI*2*pg;
    ctx.lineWidth=3;ctx.lineCap='round';
    ctx.strokeStyle=rgba(ORB,.18);ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.stroke();
    if(pg>0.002){ctx.strokeStyle=rgba(ORB,.95);ctx.beginPath();ctx.arc(cx,cy,rr,a0,a1);ctx.stroke()}
    ctx.fillStyle=rgba(ORB,1);ctx.beginPath();ctx.arc(cx+rr*Math.cos(a1),cy+rr*Math.sin(a1),5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
};

var homeRaf=0,fr=0;
function homeLoop(now){
  if(S.view!=='home'){homeRaf=0;return}
  var t=techById(S.tid),ph=phasesOf(t),L=cycleLen(ph),loc=locate(ph,(now/1000)%L);

  homeOrb.draw(loc.lv,0,1,false);
  homeRaf=requestAnimationFrame(homeLoop);
}

function keepFocus(fn){
  var a=document.activeElement,sel=null,sc=$('#libBody').scrollTop;
  if(a&&a.dataset&&a.dataset.act){
    sel='[data-act="'+a.dataset.act+'"]'+['k','d','v','id'].map(function(x){return a.dataset[x]!=null?'[data-'+x+'="'+a.dataset[x]+'"]':''}).join('');
  }
  fn();
  $('#libBody').scrollTop=sc;
  if(sel){var n=document.querySelector(sel);if(n)n.focus({preventScroll:true})}
}
function setInert(el,on){el.inert=on;if(on)el.setAttribute('aria-hidden','true');else el.removeAttribute('aria-hidden')}

/* ===== 声音、语音、触感 ===== */
var AC=null;
function ensureAudio(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
}
function tone(f0,f1,dur,vol,delay){
  if(!AC)return;
  try{
    var t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';o.frequency.setValueAtTime(f0,t0);o.frequency.linearRampToValueAtTime(f1,t0+dur);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+Math.min(.5,dur*.3));g.gain.linearRampToValueAtTime(0,t0+dur);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+.05);
  }catch(e){}
}
function bell(f,delay){tone(f,f,1.7,.05,delay);tone(f*2.01,f*2.01,1.1,.018,delay)}
function pitch(l){return 260+170*l}
function buzz(ms){if(S.haptic&&navigator.vibrate){try{navigator.vibrate(ms)}catch(e){}}}
function cue(p){
  if(S.sound&&AC){
    if(p.k==='in'||p.k==='out')tone(pitch(p.from),pitch(p.to),Math.min(p.secs,7)*.95,.07);
    else bell(p.k==='hold'?660:440);
  }
  buzz(p.k==='hold'||p.k==='rest'?8:14);
  if(S.voice&&'speechSynthesis' in window){
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(p.label);u.lang='zh-CN';u.rate=.85;u.volume=.85;
      speechSynthesis.speak(u);
    }catch(e){}
  }
}
var wl=null;
function lockOn(){try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}
function lockOff(){try{if(wl)wl.release()}catch(e){}wl=null}

/* ===== 练习 ===== */
var raf=0,frames=0;
var H={word:$('#phaseWord'),count:$('#phaseCount'),cycle:$('#cycleInfo'),remain:$('#remain')};
var ICON_PAUSE='<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.3"/><rect x="14" y="5" width="4" height="14" rx="1.3"/></svg>';
var ICON_PLAY='<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
function setText(el,v){if(el.textContent!==v)el.textContent=v}

function startSession(){
  var t=techById(S.tid),pl=plan(t);
  ensureAudio();lockOn();
  S.sess={t:t,ph:pl.ph,L:pl.L,cycles:pl.cycles,total:pl.total,elapsed:0,last:performance.now(),paused:false,prep:3,key:-2,lv:0,pg:0};
  if(S.h===0)pushH();
  S.view='session';
  var ses=$('#session');
  ses.classList.remove('done');ses.classList.add('on');setInert(ses,false);
  setInert($('#home'),true);setInert($('#lib'),true);
  $('#sName').textContent=t.name;
  $('#sRatio').textContent=metaOf(pl.ph)+' 秒';
  $('#btnPause').innerHTML=ICON_PAUSE;$('#btnPause').setAttribute('aria-label','暂停');
  H.word.textContent='准备';H.count.textContent='3';H.cycle.textContent='放松肩膀，轻轻闭上眼';
  H.remain.textContent=mmss(pl.total);
  refreshColors();sessOrb.size();
  cancelAnimationFrame(raf);
  S.sess.last=performance.now();
  raf=requestAnimationFrame(frame);
}
function frame(now){
  var s=S.sess;
  if(!s||S.view!=='session')return;
  var dt=now-s.last;s.last=now;
  if(dt>100)dt=100;
  if(!s.paused)s.elapsed+=dt;
  var t=s.elapsed/1000-s.prep,lv=0,pg=0,word,count,cyc,key;
  if(t<0){
    word='准备';count=String(Math.ceil(-t));pg=s.elapsed/1000/s.prep;key=-1;cyc='放松肩膀，轻轻闭上眼';
  }else if(t>=s.total){
    finish(true);return;
  }else{
    var ci=Math.floor(t/s.L),tc=t-ci*s.L,loc=locate(s.ph,tc);
    lv=loc.lv;pg=loc.f;word=loc.p.label;count=String(Math.max(1,Math.ceil(loc.rem-1e-6)));
    key=ci*100+loc.i;cyc='第 '+(ci+1)+' / '+s.cycles+' 轮';
    if(key!==s.key)cue(loc.p);
  }
  if(key!==s.key){
    s.key=key;H.word.textContent=word;
    H.word.classList.remove('pop');void H.word.offsetWidth;H.word.classList.add('pop');
  }
  setText(H.count,count);setText(H.cycle,cyc);
  setText(H.remain,mmss(t<0?s.total:s.total-t));
  s.lv=lv;s.pg=pg;
  if((frames++)%45===0)refreshColors();
  sessOrb.draw(lv,pg,s.paused?.5:1,true);
  raf=requestAnimationFrame(frame);
}
function setPaused(p){
  var s=S.sess;if(!s||s.paused===p)return;
  s.paused=p;s.last=performance.now();
  $('#btnPause').innerHTML=p?ICON_PLAY:ICON_PAUSE;
  $('#btnPause').setAttribute('aria-label',p?'继续':'暂停');
  try{if(AC)p?AC.suspend():AC.resume()}catch(e){}
  try{if(p&&'speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
  if(p)sessOrb.draw(s.lv,s.pg,.5,true);
}
function closeSession(){
  var ses=$('#session');
  ses.classList.remove('on','done');setInert(ses,true);
  S.view='home';
  setInert($('#home'),false);
  renderHome();startHome();
}
function finish(complete){
  var s=S.sess;if(!s)return;
  cancelAnimationFrame(raf);lockOff();
  try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
  var breath=Math.max(0,Math.min(s.total,s.elapsed/1000-s.prep));
  var secs=complete?s.total:Math.round(breath);
  var cycles=complete?s.cycles:Math.floor(breath/s.L);
  S.sess=null;
  if(complete&&S.sound&&AC){try{AC.resume()}catch(e){}bell(523);bell(784,.45)}
  if(complete)buzz(30);
  if(secs>=30){
    DB.logs.push({d:ymd(new Date()),s:secs,k:s.t.id});
    if(DB.logs.length>400)DB.logs=DB.logs.slice(-400);
    saveDB();
    var st=stats();
    $('#dEyebrow').textContent=complete?'练习完成':'提前结束';
    $('#dTitle').textContent=(complete?'完成了 ':'练习了 ')+cycles+' 轮';
    $('#dSub').textContent=s.t.name+' · 用时 '+mmss(secs)+' · 连续 '+st.streak+' 天';
    $('#session').classList.add('done');
    sessOrb.draw(.45,0,1,false);
  }else{
    closeSession();
    if(S.h>0){S.suppress=true;try{history.back()}catch(e){S.suppress=false}}
  }
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&S.sess&&!S.sess.paused)setPaused(true);
});
document.addEventListener('keydown',function(e){
  if(S.view==='session'&&S.sess&&(e.key===' '||e.code==='Space')){e.preventDefault();setPaused(!S.sess.paused)}
  else if(e.key==='Escape')back();
});

/* ===== 点击 ===== */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='lib'){if(S.view==='home'){pushH();openLib()}}
  else if(a==='back'){back()}
  else if(a==='pick'){S.tid=b.dataset.id;savePrefs();keepFocus(renderLib);renderHome()}
  else if(a==='goal'){S.goal=b.dataset.v;keepFocus(renderLib)}
  else if(a==='mins'){S.mins=+b.dataset.v;savePrefs();renderHome()}
  else if(a==='toggle'){
    var k=b.dataset.v;S[k]=!S[k];savePrefs();
    if(S[k]&&k==='sound')ensureAudio();
    if(S[k]&&k==='haptic')buzz(20);
    keepFocus(renderLib);
  }
  else if(a==='step'){
    var key=b.dataset.k,d=+b.dataset.d,min=(key==='i'||key==='o')?1:0;
    S.custom[key]=Math.max(min,Math.min(12,S.custom[key]+d));savePrefs();keepFocus(renderLib);renderHome();
  }
  else if(a==='start'){if(S.view==='home')startSession()}
  else if(a==='again'){startSession()}
  else if(a==='pause'){if(S.sess)setPaused(!S.sess.paused)}
  else if(a==='end'){back()}
  else if(a==='finishclose'){back()}
});

/* ===== 启动 ===== */
refreshColors();
renderHome();
sizeAll();
startHome();
})();
</script>
<script>
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
