<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ebefec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121a27" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="吐纳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>吐纳</title>
<style>
@font-face{font-family:"TunaKai";src:url("fonts/wenkai.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"TunaBrush";src:url("fonts/brush.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
:root{
  /* 宣纸与墨：纸面带纹理，呼吸画成会晕开的墨，用一炷香计时，完成时盖章。
     每种呼吸法配一对传统颜料色（朱砂、石青、藕荷、石绿、赭石），印章统一用朱红。
     版式像一幅题了款的画：圆相偏左，题款竖排在右，时长像一把尺子。 */
  color-scheme:light;
  --paper:#ebefec;
  --paper2:#dfe6e2;
  --ink:#1f2831;
  --ink2:rgb(31 40 49 / .64);
  --ink3:rgb(31 40 49 / .36);
  --line:rgb(31 40 49 / .17);
  --seal:198 52 40;
  --p1:226 78 52;
  --p2:244 176 44;
  --grain:url("textures/grain-light.png");
  --mottle:url("textures/mottle-light.png");
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --kai:"TunaKai","LXGW WenKai","Kaiti SC","STKaiti","KaiTi","Songti SC","Noto Serif CJK SC",serif;
  --brush:"TunaBrush","Ma Shan Zheng","STXingkai","Xingkai SC","Kaiti SC","KaiTi",serif;
  --spring:cubic-bezier(.3,1.5,.55,1);
  --smooth:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --paper:#121a27;--paper2:#1b2535;--ink:#e8edeb;--ink2:rgb(232 237 235 / .66);--ink3:rgb(232 237 235 / .38);--line:rgb(232 237 235 / .18);
    --seal:224 84 66;--grain:url("textures/grain-dark.png");--mottle:url("textures/mottle-dark.png");
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background-color:var(--paper);background-image:var(--mottle),var(--grain);color:var(--ink);font-family:var(--kai);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid rgb(var(--p1));outline-offset:3px}
h1,h2,h3,p{margin:0}
.brush{font-family:var(--brush);font-weight:400}
.paper{background-color:var(--paper);background-image:var(--mottle),var(--grain)}
.layer{position:fixed;inset:0;display:flex;flex-direction:column}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 印章 */
.seal{display:grid;grid-template-columns:1fr 1fr;place-items:center;background:rgb(var(--seal));color:var(--paper);border-radius:5px;font-family:var(--brush);line-height:1;filter:url(#rough)}
.seal span{display:block}
.seal.mini{width:30px;height:30px;font-size:13px;padding:2px;transform:rotate(-5deg)}
.seal.pig{width:34px;height:34px;font-family:var(--kai);font-size:13px;padding:3px;transform:rotate(4deg)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.rise{animation:rise .7s var(--smooth) backwards;animation-delay:var(--d,0ms)}
@keyframes swapL{from{opacity:0;transform:translateX(18px)}}
@keyframes swapR{from{opacity:0;transform:translateX(-18px)}}
.swapL{animation:swapL .5s var(--smooth)}
.swapR{animation:swapR .5s var(--smooth)}

/* ---------- 第一层：主界面 ---------- */
.home{z-index:1;padding:calc(var(--sat) + 10px) max(20px,var(--sar)) calc(var(--sab) + 14px) max(20px,var(--sal));transition:transform .5s var(--smooth),opacity .5s}
.home.pushed{transform:translateX(-14%);opacity:.35}
.h-top{display:flex;align-items:center;gap:10px;min-height:48px}
.h-time{flex:1;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.h-time b{font-size:17px;font-weight:400;letter-spacing:.12em}
.h-time span{font-size:13px;color:var(--ink2);letter-spacing:.06em}
.h-menu{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;transition:transform .35s var(--spring)}
.h-menu:active{transform:scale(.86)}
.h-menu svg{display:block}
.stage{position:relative;flex:1;min-height:180px;touch-action:none;cursor:pointer;outline-offset:-4px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hint{position:absolute;left:0;top:50%;width:var(--hw,60%);text-align:center;transform:translateY(-50%);font-size:16px;letter-spacing:.3em;padding-left:.3em;color:var(--ink2);pointer-events:none;transition:opacity .3s}
.hint.hot{color:var(--ink)}
.hint.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-6px,-50%)}40%{transform:translate(5px,-50%)}60%{transform:translate(-3px,-50%)}80%{transform:translate(2px,-50%)}}
.inscr{position:absolute;right:max(0px,var(--sar));top:6px;display:flex;flex-direction:column;align-items:center;gap:12px}
.inscr .v{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:8px}
.vt{writing-mode:vertical-rl;text-orientation:upright}
.inscr .name{font-size:44px;letter-spacing:.1em;line-height:1.12;color:var(--ink);display:block;min-height:1em}
.inscr .tag{font-size:14px;letter-spacing:.22em;color:var(--ink2);margin-top:10px;display:block}
.inscr button{display:block;text-align:center;border-radius:12px;padding:4px 2px;transition:transform .35s var(--spring)}
.inscr button:active{transform:scale(.95)}
.rhythm{position:absolute;left:max(16px,var(--sal));bottom:6px;font-size:14px;letter-spacing:.26em;color:var(--ink2)}
.h-bot{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:6px}
.dots{display:flex;gap:9px;align-items:center;min-height:22px}
.dots button{width:22px;height:22px;display:grid;place-items:center}
.dots i{display:block;width:6px;height:6px;border-radius:3px;background:var(--ink3);transition:width .5s var(--spring),background .3s}
.dots button[aria-current="true"] i{width:20px;background:rgb(var(--p1))}
.ruler{display:flex;align-items:center;gap:12px}
.ruler .rl{font-size:13px;color:var(--ink2);letter-spacing:.2em}
.rbox{position:relative;display:flex;align-items:center}
.rbox .mark{position:absolute;left:0;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:52% 48% 55% 45% / 48% 54% 46% 52%;border:1.6px solid rgb(var(--p1));background:rgb(var(--p1) / .12);transform:translateX(calc(var(--i,1) * 44px)) rotate(-8deg);transition:transform .55s var(--spring)}
.rbox button{position:relative;width:44px;height:44px;font-size:22px;color:var(--ink);transition:transform .3s var(--spring)}
.rbox button:active{transform:scale(.88)}
.ruler .ru{font-size:13px;color:var(--ink2);letter-spacing:.2em}
.sub-hint{font-size:12px;color:var(--ink3);letter-spacing:.14em;min-height:18px}

/* ---------- 第二层：目录与设置 ---------- */
.lib{z-index:10;transform:translateX(100%);visibility:hidden;box-shadow:-1px 0 0 var(--line);transition:transform .5s var(--smooth),visibility 0s .5s}
.lib.open{transform:none;visibility:visible;transition:transform .5s var(--smooth),visibility 0s}
.nav{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 2px) max(10px,var(--sar)) 0 max(10px,var(--sal));min-height:calc(var(--sat) + 50px)}
.nav-back{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;font-size:16px;letter-spacing:.1em;color:var(--ink)}
.nav-back svg{margin-right:2px}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px max(22px,var(--sar)) calc(var(--sab) + 40px) max(22px,var(--sal))}
.scroll.enter .blk{animation:rise .65s var(--smooth) backwards}
.scroll.enter .blk:nth-child(2){animation-delay:.06s}.scroll.enter .blk:nth-child(3){animation-delay:.12s}
.scroll.enter .blk:nth-child(4){animation-delay:.18s}.scroll.enter .blk:nth-child(5){animation-delay:.24s}
.l-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 0 18px;border-bottom:1px solid var(--line)}
.l-head h2{font-size:46px;letter-spacing:.14em;line-height:1.1}
.l-head p{font-size:13px;color:var(--ink2);letter-spacing:.1em;text-align:right;line-height:1.7}
.ent{border-bottom:1px solid var(--line)}
.ent-h{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:76px;padding:12px 0}
.ent-n{width:26px;font-size:20px;color:rgb(var(--e1));text-align:center;flex:none;transition:transform .5s var(--spring)}
.ent.sel .ent-n{transform:scale(1.25)}
.ent-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ent-name{font-family:var(--brush);font-weight:400;font-size:28px;letter-spacing:.08em;line-height:1.2;transition:color .3s}
.ent.sel .ent-name{color:rgb(var(--e1))}
.ent-tag{font-size:13px;color:var(--ink2);letter-spacing:.08em;font-style:normal}
.stamp{flex:none;border:1.5px solid rgb(var(--seal));color:rgb(var(--seal));border-radius:4px;padding:3px 5px;font-size:11px;line-height:1.2;text-align:center;letter-spacing:.06em;transform:rotate(-4deg)}
.ent-b{padding:0 0 22px 40px;display:flex;flex-direction:column;gap:14px;animation:rise .55s var(--smooth)}
.brushline{width:100%;aspect-ratio:320/78}
.brushline svg{width:100%;height:100%;display:block;overflow:visible}
.bl-main{fill:none;stroke:rgb(var(--e1));stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.bl-ghost{fill:none;stroke:rgb(var(--e2));stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.3;vector-effect:non-scaling-stroke}
.rhy{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;letter-spacing:.1em}
.rhy b{font-weight:400;color:rgb(var(--e1))}
.fld{display:flex;flex-direction:column;gap:2px;font-size:15px;line-height:1.75}
.fld .k{font-size:12px;letter-spacing:.3em;color:var(--ink2)}
.basis{font-size:13.5px;line-height:1.8;color:var(--ink2);border-left:2px solid var(--line);padding-left:12px}
.zhupi{font-size:14px;line-height:1.75;color:rgb(var(--seal));border-left:2px solid rgb(var(--seal));padding-left:12px}
.stp{width:40px;height:34px;border:1.4px solid var(--line);border-radius:17px 13px 16px 14px;font-size:20px;line-height:1;transition:transform .3s var(--spring)}
.stp:active{transform:scale(.9)}
.stp:disabled{opacity:.3;cursor:default}
.sv{min-width:28px;text-align:center;font-weight:400;font-size:18px}
.note.bad{color:rgb(var(--seal))}
.sect{padding-top:26px}
.sect h3{font-family:var(--brush);font-weight:400;font-size:26px;letter-spacing:.2em;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line);font-size:16px;letter-spacing:.1em}
.opt .sp{flex:1}
.sw{width:46px;height:26px;border-radius:13px;border:1.5px solid var(--ink3);position:relative;flex:none;transition:background .3s,border-color .3s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:var(--ink3);transition:transform .45s var(--spring),background .3s}
.sw[aria-checked="true"]{background:rgb(var(--seal) / .14);border-color:rgb(var(--seal))}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:rgb(var(--seal))}
.voices{display:flex;flex-wrap:wrap;gap:8px 10px;padding:10px 0 14px;border-bottom:1px solid var(--line)}
.voices button{min-width:52px;min-height:38px;padding:0 14px;border:1.4px solid var(--line);border-radius:19px 15px 18px 16px;font-size:15px;letter-spacing:.1em;transition:transform .3s var(--spring),border-color .3s,background .3s}
.voices button:active{transform:scale(.92)}
.voices button[aria-pressed="true"]{border-color:rgb(var(--seal));color:rgb(var(--seal));background:rgb(var(--seal) / .08)}
.note{font-size:13px;color:var(--ink2);line-height:1.8;letter-spacing:.04em;padding-top:8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;height:92px;padding-top:8px}
.wd{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%}
.wd i{display:block;background:rgb(var(--p1) / .78);animation:blot .8s var(--spring) backwards}
.wd i.none{background:var(--ink3);opacity:.5}
.wd span{font-size:13px;color:var(--ink2)}
.wd.today span{color:rgb(var(--seal))}
@keyframes blot{from{transform:scale(.1);opacity:0}}
.sum{font-size:14px;color:var(--ink2);letter-spacing:.08em;padding-top:12px}
.sum b{font-weight:400;color:var(--ink);font-size:16px}
.foot{font-size:12.5px;color:var(--ink3);line-height:1.85;padding-top:26px;letter-spacing:.04em}

/* ---------- 练习与完成 ---------- */
.session{z-index:20;opacity:0;visibility:hidden;padding:calc(var(--sat) + 10px) max(20px,var(--sar)) calc(var(--sab) + 16px) max(20px,var(--sal));transition:opacity .45s,visibility 0s .45s}
.session.on{opacity:1;visibility:visible;transition:opacity .45s,visibility 0s}
.s-stage{position:relative;flex:1;min-height:190px}
.s-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.s-stage .incense{inset:auto;left:0;top:6%;width:56px;height:88%}
.s-ins{position:absolute;right:0;top:4px;display:flex;flex-direction:row-reverse;align-items:flex-start;gap:8px}
.s-ins .name{font-size:30px;letter-spacing:.1em;line-height:1.15}
.s-ins .rhy2{font-size:12.5px;letter-spacing:.24em;color:var(--ink2);margin-top:6px}
.s-word{text-align:center;display:flex;flex-direction:column;align-items:center;min-height:168px;justify-content:center;gap:0}
.glyph{font-size:92px;line-height:1.05;color:rgb(var(--p1))}
.glyph.in{animation:ink .7s var(--smooth)}
@keyframes ink{from{opacity:0;transform:scale(1.18);filter:blur(5px)}}
.s-lab{font-size:15px;letter-spacing:.4em;padding-left:.4em;color:var(--ink2)}
.s-cnt{font-size:26px;letter-spacing:.2em;padding-left:.2em;min-height:36px;color:var(--ink)}
.s-cyc{font-size:13px;color:var(--ink2);letter-spacing:.2em;min-height:20px;text-align:center}
.s-bot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:84px}
.remain{font-size:16px;color:var(--ink2);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.pbtn{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;transition:transform .35s var(--spring)}
.pbtn:active{transform:scale(.88)}
.endb{justify-self:end;min-height:44px;padding:0 6px;font-size:16px;letter-spacing:.2em;color:var(--ink)}
.donebox{display:none;position:relative;flex-direction:column;gap:6px;padding:4px 4px 6px}
.session.done .donebox{display:flex}
.session.done .run{display:none}
.session.done .incense{display:none}
.d-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.d-eyebrow{font-size:14px;letter-spacing:.3em;color:var(--ink2)}
.d-title{font-size:44px;letter-spacing:.1em;line-height:1.15;margin-top:2px}
.d-sub{font-size:15px;color:var(--ink2);letter-spacing:.08em}
.d-sum{font-size:15px;letter-spacing:.08em;margin-top:4px}
.seal.big{width:92px;height:92px;font-size:38px;padding:6px;flex:none;margin-top:6px;transform:rotate(-6deg);animation:stamp .62s cubic-bezier(.4,0,.6,1) .35s backwards}
@keyframes stamp{0%{transform:scale(2.6) rotate(-16deg);opacity:0}55%{transform:scale(.92) rotate(-6deg);opacity:1}72%{transform:scale(1.05) rotate(-6deg)}100%{transform:scale(1) rotate(-6deg)}}
.d-btns{display:flex;gap:26px;align-items:center;margin-top:18px}
.lnk{min-height:46px;font-size:17px;letter-spacing:.2em;padding:0 2px;border-bottom:1.5px solid rgb(var(--p1));transition:transform .3s var(--spring)}
.lnk:active{transform:scale(.94)}
.lnk.quiet{border-bottom-color:transparent;color:var(--ink2)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-height:660px){
  .inscr .name{font-size:38px}
  .glyph{font-size:72px}
  .s-word{min-height:140px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency=".07" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4"/>
  </filter>
</svg>

<section id="home" class="layer home" aria-label="主界面">
  <header class="h-top rise">
    <div class="seal mini" aria-hidden="true"><span>吐</span><span></span><span></span><span>纳</span></div>
    <div class="h-time"><b id="hShi"></b><span id="hTerm"></span></div>
    <button class="h-menu" data-act="lib" aria-label="呼吸方式与设置">
      <svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 4.5c6-1.5 14-1.5 20 0"/><path d="M3 10.5c4-1 10-1 14 0"/><path d="M3 16c7-1.2 13-1.2 18 0"/></svg>
    </button>
  </header>
  <div id="stage" class="stage rise" style="--d:90ms" role="button" tabindex="0" aria-label="开始练习：按住圆相约一秒，或按回车；左右轻划换一式">
    <canvas id="homeCv" aria-hidden="true"></canvas>
    <div id="hint" class="hint">按住 · 落墨</div>
    <div class="inscr rise" style="--d:200ms">
      <div class="v"><h1 id="iName" class="name brush vt"></h1><p id="iTag" class="tag vt"></p></div>
      <button data-act="lib" aria-label="查看这一式的做法与依据"><span id="iSeal" class="seal pig"></span></button>
    </div>
    <p id="rhythm" class="rhythm vt" aria-hidden="true"></p>
  </div>
  <footer class="h-bot rise" style="--d:280ms">
    <div id="dots" class="dots" role="group" aria-label="呼吸方式"></div>
    <div class="ruler"><span class="rl">时长</span><div id="rbox" class="rbox" role="group" aria-label="时长"></div><span class="ru">分钟</span></div>
    <p id="subHint" class="sub-hint"></p>
  </footer>
</section>

<section id="lib" class="layer lib paper" inert aria-label="呼吸方式与设置">
  <nav class="nav">
    <button class="nav-back" data-act="back"><svg width="10" height="18" viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 1.5L1.5 9l7 7.5"/></svg>返回</button>
  </nav>
  <div id="libBody" class="scroll"></div>
</section>

<section id="session" class="layer session paper" inert role="dialog" aria-label="呼吸练习">
  <div id="sStage" class="s-stage">
    <canvas id="sessCv" aria-hidden="true"></canvas>
    <canvas id="incense" class="incense" aria-hidden="true"></canvas>
    <div class="s-ins"><h2 id="sName" class="name brush vt"></h2><p id="sRhy" class="rhy2 vt"></p></div>
  </div>
  <div class="s-word run">
    <div id="glyph" class="glyph brush" aria-hidden="true">静</div>
    <div id="sLab" class="s-lab" aria-live="polite">准备</div>
    <div id="sCnt" class="s-cnt"></div>
  </div>
  <p id="sCyc" class="s-cyc run"></p>
  <div class="s-bot run">
    <span id="remain" class="remain">00:00</span>
    <button id="btnPause" class="pbtn" data-act="pause" aria-label="暂停"></button>
    <button class="endb" data-act="end">结束</button>
  </div>
  <div class="donebox">
    <div class="d-row">
      <div>
        <p id="dEye" class="d-eyebrow"></p>
        <h2 id="dTitle" class="d-title brush"></h2>
      </div>

/* ===== 状态与存储 ===== */

/* ===== 工具 ===== */
function phasesOf(t){return t.id==='custom'?mk(S.custom.i,S.custom.h,S.custom.o,S.custom.r):t.phases}
function cycleLen(ph){var a=0;ph.forEach(function(p){a+=p.secs});return a}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function bpmOf(ph){return Math.round(60/cycleLen(ph)*10)/10}
function rhythmCN(ph){return ph.map(function(p){return SHORT[p.label]+cnf(p.secs)}).join('·')}
function ease(f){return .5-.5*Math.cos(Math.PI*f)}
function levelOf(p,f){return (p.k==='in'||p.k==='out')?p.from+(p.to-p.from)*ease(f):p.to}
function locate(ph,tc){
  var a=0;
  for(var i=0;i<ph.length;i++){
    var p=ph[i];
    if(tc<a+p.secs||i===ph.length-1){
      var f=Math.min(1,Math.max(0,(tc-a)/p.secs));
      return {i:i,p:p,f:f,lv:levelOf(p,f),rem:p.secs-(tc-a)};
    }
    a+=p.secs;
  }
}
function plan(t){
  var ph=phasesOf(t),L=cycleLen(ph),cycles=Math.max(1,Math.round(S.mins*60/L));
  return {ph:ph,L:L,cycles:cycles,total:cycles*L};
}
function pad2(n){return n<10?'0'+n:''+n}
function mmss(s){s=Math.max(0,Math.ceil(s-1e-6));return pad2(Math.floor(s/60))+':'+pad2(s%60)}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function brushLine(ph,w,h,pad){
  var L=cycleLen(ph),a=0,pts=[];
  ph.forEach(function(p){
    var moving=(p.k==='in'||p.k==='out'),n=moving?18:2;
    for(var j=0;j<=n;j++){var f=j/n;pts.push([(a+p.secs*f)/L*w,h-pad-levelOf(p,f)*(h-2*pad)])}
    a+=p.secs;
  });
  var d='M'+pts.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('L');
  var d2='M'+pts.map(function(q){return (q[0]+2).toFixed(1)+' '+(q[1]+3).toFixed(1)}).join('L');
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><path class="bl-ghost" d="'+d2+'"/><path class="bl-main" d="'+d+'"/></svg>';
}
function stats(){
  var map={};
  DB.logs.forEach(function(l){map[l.d]=(map[l.d]||0)+l.s});
  var today=new Date(),days=[],weekSecs=0,i;
  for(i=6;i>=0;i--){
    var d=new Date(today.getFullYear(),today.getMonth(),today.getDate()-i),k=ymd(d),s=map[k]||0;
    weekSecs+=s;days.push({k:k,s:s,wd:WD[d.getDay()],today:i===0});
  }
  var streak=0,c=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  if(!map[ymd(c)])c.setDate(c.getDate()-1);
  while(map[ymd(c)]){streak++;c.setDate(c.getDate()-1)}
  return {days:days,streak:streak,weekMin:Math.round(weekSecs/60),count:DB.logs.length};
}

/* ===== 颜料：切换方式时颜色平滑过渡 ===== */
function pigment(id){var p=PIG[id]||PIG.sigh,a=DARK?p.d:p.l;return {p1:a[0].slice(),p2:a[1].slice()}}
function lerp(a,b,t){return a+(b-a)*t}
function lerpC(a,b,t){return [Math.round(lerp(a[0],b[0],t)),Math.round(lerp(a[1],b[1],t)),Math.round(lerp(a[2],b[2],t))]}
var CUR=pigment(S.tid);
function applyPal(){root.style.setProperty('--p1',CUR.p1.join(' '));root.style.setProperty('--p2',CUR.p2.join(' '))}
var palAnim=0;
function setPalette(id){
  var to=pigment(id);
  cancelAnimationFrame(palAnim);
  if(REDUCE){CUR=to;applyPal();return}
  var from={p1:CUR.p1.slice(),p2:CUR.p2.slice()},t0=performance.now();
  (function step(now){
    var k=Math.min(1,(now-t0)/650),e=1-Math.pow(1-k,3);
    CUR={p1:lerpC(from.p1,to.p1,e),p2:lerpC(from.p2,to.p2,e)};
    applyPal();
    if(k<1)palAnim=requestAnimationFrame(step);
  })(t0);
}
applyPal();
function inkRGB(){return DARK?[232,237,235]:[31,40,49]}
function sealRGB(){return DARK?[224,84,66]:[198,52,40]}

/* ===== 墨：晕开的圆相 ===== */
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function Bloom(cv,wrap,ox,fit){
  this.cv=cv;this.wrap=wrap;this.ctx=cv.getContext('2d');this.ox=ox;this.fit=fit;
  this.w=0;this.h=0;this.a=[.5,-1,1,0,0];this.last=0;this.rip=[];this.drops=[];
  this.seeds=[];for(var i=0;i<7;i++)this.seeds.push(Math.random()*6.283);
  this.spl=[];for(i=0;i<9;i++)this.spl.push({a:Math.random()*6.283,d:1.18+Math.random()*.5,s:1+Math.random()*2.4,ph:Math.random()*6.283});
}
Bloom.prototype.size=function(){
  var dpr=Math.min(1.6,window.devicePixelRatio||1);
  this.w=this.wrap.clientWidth;this.h=this.wrap.clientHeight;
  this.cv.width=Math.max(1,Math.round(this.w*dpr));this.cv.height=Math.max(1,Math.round(this.h*dpr));
  this.ctx.setTransform(dpr,0,0,dpr,0,0);
  this.draw.apply(this,this.a);
};
Bloom.prototype.pulse=function(dir){this.rip.push({age:0,dir:dir});if(this.rip.length>3)this.rip.shift()};
Bloom.prototype.splash=function(){
  var cols=[CUR.p1,CUR.p2,sealRGB(),CUR.p1];
  for(var i=0;i<46;i++){
    var an=Math.random()*6.283,sp=90+Math.random()*260;
    this.drops.push({x:0,y:0,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-60,life:1,dec:.55+Math.random()*.6,s:1.6+Math.random()*3.6,c:cols[i%cols.length]});
  }
};
function blob(ctx,cx,cy,R,t,seed,amp){
  var N=60;
  ctx.beginPath();
  for(var i=0;i<=N;i++){
    var a=i/N*6.2832;
    var r=R*(1+amp*(Math.sin(a*2+t*.7+seed)*.5+Math.sin(a*3-t*.5+seed*1.7)*.34+Math.sin(a*5+t*.9+seed*2.3)*.16));
    var x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
  }
  ctx.closePath();
}
Bloom.prototype.draw=function(lv,ringP,dim,now,press){
  this.a=[lv,ringP,dim,now,press];
  var dt=this.last?Math.min(.05,(now-this.last)/1000):0;this.last=now;
  var t=now/1000,ctx=this.ctx,cw=this.w,ch=this.h,i;
  ctx.clearRect(0,0,cw,ch);
  ctx.globalAlpha=dim;
  var cx=cw*this.ox,cy=ch*.5,Rm=Math.min(cw*this.fit,ch/2),R=Rm*.74;
  var r=R*(.56+.44*lv)*(1-.07*(press||0));
  var C1=CUR.p1,C2=CUR.p2,ink=inkRGB(),k=DARK?1.25:1;
  /* 涟漪 */
  for(i=this.rip.length-1;i>=0;i--){
    var rp=this.rip[i];rp.age+=dt;
    var q=rp.age/2.6;
    if(q>=1){this.rip.splice(i,1);continue}
    var rr=rp.dir==='in'?r*(1.06+.8*q):r*(1.9-.8*q);
    ctx.strokeStyle=rgba(C1,(1-q)*.42);ctx.lineWidth=1.4;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,6.283);ctx.stroke();
  }
  /* 飞白：边缘飞溅的小墨点 */
  for(i=0;i<this.spl.length;i++){
    var s=this.spl[i],an=s.a+t*.05,dist=r*(s.d+.05*Math.sin(t*.9+s.ph)+.12*lv);
    ctx.fillStyle=rgba(i%2?C2:C1,(.16+.2*lv)*k);
    ctx.beginPath();ctx.arc(cx+Math.cos(an)*dist,cy+Math.sin(an)*dist,s.s,0,6.283);ctx.fill();
  }
  /* 晕开的须 */
  ctx.lineCap='round';
  for(i=0;i<10;i++){
    var a0=i/10*6.283+t*.04+this.seeds[i%7]*.2,len=r*(.1+.3*lv*(.55+.45*Math.sin(t*.8+i*1.9)));
    var x0=cx+Math.cos(a0)*r*.97,y0=cy+Math.sin(a0)*r*.97;
    var x1=cx+Math.cos(a0+.1)*(r+len),y1=cy+Math.sin(a0+.1)*(r+len);
    ctx.strokeStyle=rgba(i%3?C1:C2,.2*k);ctx.lineWidth=1.1;
    ctx.beginPath();ctx.moveTo(x0,y0);
    ctx.quadraticCurveTo(cx+Math.cos(a0-.08)*(r+len*.6),cy+Math.sin(a0-.08)*(r+len*.6),x1,y1);ctx.stroke();
  }
  /* 墨层：由淡到浓 */
  for(i=0;i<6;i++){
    blob(ctx,cx+Math.sin(t*.3+i)*r*.03*i,cy+Math.cos(t*.27+i)*r*.03*i,r*(1-i*.085),t,this.seeds[i%7],.045);
    ctx.fillStyle=rgba(i<3?C1:C2,(i<3?.12:.14)*k);ctx.fill();
  }
  blob(ctx,cx,cy,r*.42,t*1.2,this.seeds[5],.09);
  ctx.fillStyle=rgba(C1,.24*k);ctx.fill();
  /* 水痕：边缘积墨 */
  blob(ctx,cx,cy,r,t,this.seeds[0],.045);
  ctx.strokeStyle=rgba(C1,.66);ctx.lineWidth=1.4;ctx.stroke();
  blob(ctx,cx,cy,r*1.035,t,this.seeds[0]+.4,.05);
  ctx.strokeStyle=rgba(C1,.27);ctx.lineWidth=3.4;ctx.stroke();
  /* 外圈：墨线与进度 */
  if(ringP>=0){
    var rr2=Rm*.93,a1=-Math.PI/2+6.283*ringP;
    ctx.lineWidth=1;ctx.strokeStyle=rgba(ink,.2);ctx.beginPath();ctx.arc(cx,cy,rr2,0,6.283);ctx.stroke();
    if(ringP>.002){ctx.lineWidth=3;ctx.strokeStyle=rgba(C1,.92);ctx.beginPath();ctx.arc(cx,cy,rr2,-Math.PI/2,a1);ctx.stroke()}
    ctx.fillStyle=rgba(sealRGB(),1);ctx.beginPath();ctx.arc(cx+rr2*Math.cos(a1),cy+rr2*Math.sin(a1),4.2,0,6.283);ctx.fill();
  }
  /* 落墨 */
  for(i=this.drops.length-1;i>=0;i--){
    var d=this.drops[i];d.life-=d.dec*dt;
    if(d.life<=0){this.drops.splice(i,1);continue}
    d.vy+=240*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.vx*=.985;
    ctx.fillStyle=rgba(d.c,Math.min(1,d.life*1.3)*.85);
    ctx.beginPath();ctx.arc(cx+d.x,cy+d.y,d.s*(.5+.5*d.life),0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;
};

/* ===== 一炷香：剩余时间 ===== */
function Incense(cv){this.cv=cv;this.ctx=cv.getContext('2d');this.w=0;this.h=0;this.sm=[];this.acc=0;this.last=0;this.skip=0;this.fr=1}
Incense.prototype.size=function(){
  var dpr=Math.min(1.6,window.devicePixelRatio||1);
  this.w=this.cv.clientWidth;this.h=this.cv.clientHeight;
  this.cv.width=Math.max(1,Math.round(this.w*dpr));this.cv.height=Math.max(1,Math.round(this.h*dpr));
  this.ctx.setTransform(dpr,0,0,dpr,0,0);
  this.render(this.fr,1);
};
Incense.prototype.draw=function(frac,now,run){
  if((this.skip++)&1)return;
  var dt=this.last?Math.min(.08,(now-this.last)/1000):0;this.last=now;
  if(run){
    this.acc+=dt;
    if(this.acc>.11){this.acc=0;this.sm.push({age:0,ph:Math.random()*6.283,life:3.4+Math.random()*1.6,sw:.7+Math.random()*.7})}
    for(var i=this.sm.length-1;i>=0;i--){this.sm[i].age+=dt;if(this.sm[i].age>this.sm[i].life)this.sm.splice(i,1)}
  }
  this.fr=frac;this.render(frac,run?1:0);
};
Incense.prototype.render=function(frac,run){
  var ctx=this.ctx,w=this.w,h=this.h,cx=w/2,baseY=h-16,maxL=h*.5,topY=baseY-maxL*Math.max(0,frac),ink=inkRGB(),i;
  ctx.clearRect(0,0,w,h);
  /* 烟 */
  for(i=0;i<this.sm.length;i++){
    var s=this.sm[i],q=s.age/s.life;
    var y=topY-q*(h*.42),x=cx+Math.sin(s.age*1.5+s.ph)*(3+q*15*s.sw);
    ctx.fillStyle=rgba(ink,.2*(1-q)*(q<.08?q/.08:1));
    ctx.beginPath();ctx.arc(x,y,1.6+q*4.2,0,6.283);ctx.fill();
  }
  /* 香炉：小碗与香灰 */
  ctx.strokeStyle=rgba(ink,.45);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(cx-15,baseY+3);ctx.quadraticCurveTo(cx,baseY+17,cx+15,baseY+3);ctx.stroke();
  ctx.fillStyle=rgba(ink,.2);ctx.beginPath();ctx.ellipse(cx,baseY+2,13,3,0,0,6.283);ctx.fill();
  /* 香 */
  ctx.strokeStyle=rgba(ink,.72);ctx.lineWidth=2.4;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(cx,baseY);ctx.lineTo(cx,topY);ctx.stroke();
  /* 火星 */
  if(frac>0.002){
    var g=ctx.createRadialGradient(cx,topY,0,cx,topY,10);
    g.addColorStop(0,'rgba(255,150,60,.85)');g.addColorStop(1,'rgba(255,120,40,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,topY,10,0,6.283);ctx.fill();
    ctx.fillStyle='#ff8a3d';ctx.beginPath();ctx.arc(cx,topY,2.4,0,6.283);ctx.fill();
  }
};

var Voice={list:[],
  load:function(){
    var out=[];
    try{
      if(window.TunaVoice){
        JSON.parse(window.TunaVoice.list()||'[]').forEach(function(v,i){out.push({name:v.name,label:cn(i+1)+(v.local?'':'（联网）')})});
      }else if('speechSynthesis' in window){
        var FEM=/xiaoxiao|xiaoyi|xiaohan|xiaomeng|huihui|yaoyao|ting-?ting|mei-?jia|sin-?ji|female|女|婷|晓/i;
        var MALE=/yunxi|yunyang|yunjian|kangkang|male|男/i;
        var vs=speechSynthesis.getVoices().filter(function(v){return /^zh/i.test(v.lang)&&!/HK|yue/i.test(v.lang+v.name)});
        vs.sort(function(a,b){
          var sa=(FEM.test(a.name)?0:MALE.test(a.name)?2:1),sb=(FEM.test(b.name)?0:MALE.test(b.name)?2:1);
          return sa-sb||(a.localService===b.localService?0:a.localService?-1:1);
        });
        vs.forEach(function(v,i){out.push({name:v.name,label:cn(i+1)})});
      }
    }catch(e){}
    if(out.length||!this.list.length)this.list=out;
    return this.list;
  },
  available:function(){return !!window.TunaVoice||('speechSynthesis' in window)},
  current:function(){
    var l=this.list;

  },

        speechSynthesis.speak(u);
      }
    }catch(e){}
  },
  stop:function(){
    try{

    }catch(e){}
  }
};

function tone(f0,f1,dur,vol,delay){
  if(!AC)return;

    var t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();

    else bell(p.k==='hold'?660:440);
  }
  buzz(p.k==='hold'||p.k==='rest'?8:14);
  if(p.k==='in'&&p.from===0)sessBloom.pulse('in');
  else if(p.k==='out')sessBloom.pulse('out');
  if(S.voice)Voice.speak(sayFor(s,loc,ci));
}
function showGlyph(g,lab){
  var el=$('#glyph');
  if(el.textContent!==g){el.textContent=g;el.classList.remove('in');void el.offsetWidth;el.classList.add('in')}
  setText($('#sLab'),lab);
}
function startSession(){
  var t=techById(S.tid),pl=plan(t);
  ensureAudio();lockOn();
  var prep=(S.voice&&Voice.available())?6:3;
  S.sess={t:t,ph:pl.ph,L:pl.L,cycles:pl.cycles,total:pl.total,elapsed:0,last:performance.now(),paused:false,prep:prep,key:-2,lv:0,pg:0};
  if(depth===0)pushView();
  S.view='session';
  var ses=$('#session');
  ses.classList.remove('done');ses.classList.add('on');setInert(ses,false);
  setInert($('#home'),true);setInert($('#lib'),true);
  $('#sName').textContent=t.name;
  $('#sRhy').textContent=rhythmCN(pl.ph);
  $('#btnPause').innerHTML=ICON_PAUSE;$('#btnPause').setAttribute('aria-label','暂停');
  showGlyph('静','准备');
  $('#sCnt').textContent=cn(prep);$('#sCyc').textContent='放松肩膀，轻轻闭上眼';
  $('#remain').textContent=mmss(pl.total);
  hold.p=0;hold.on=false;
  sizeAll();
  cancelAnimationFrame(raf);
  if(S.voice)Voice.speak(INTRO);
  S.sess.last=performance.now();
  raf=requestAnimationFrame(frame);
}
function frame(now){
  var s=S.sess;
  if(!s||S.view!=='session')return;
  var dt=now-s.last;s.last=now;
  if(dt>100)dt=100;
  if(!s.paused)s.elapsed+=dt;
  var t=s.elapsed/1000-s.prep,lv=0,pg=0,cnt,cyc,key,loc=null,ci=0;
  if(t<0){
    cnt=cn(Math.ceil(-t));pg=s.elapsed/1000/s.prep;key=-1;cyc='放松肩膀，轻轻闭上眼';
  }else if(t>=s.total){
    finish(true);return;
  }else{
    ci=Math.floor(t/s.L);var tc=t-ci*s.L;loc=locate(s.ph,tc);
    lv=loc.lv;pg=loc.f;cnt=cn(Math.max(1,Math.ceil(loc.rem-1e-6)));
    key=ci*100+loc.i;cyc='第'+cn(ci+1)+'轮 · 共'+cn(s.cycles)+'轮';
    if(key!==s.key){cue(s,loc,ci);showGlyph(GLYPH[loc.p.label]||'息',loc.p.label)}
  }
  s.key=key;
  setText($('#sCnt'),cnt);setText($('#sCyc'),cyc);
  setText($('#remain'),mmss(t<0?s.total:s.total-t));
  s.lv=lv;s.pg=pg;
  sessBloom.draw(lv,pg,s.paused?.55:1,now,0);
  incense.draw(t<0?1:Math.max(0,1-t/s.total),now,!s.paused);
  raf=requestAnimationFrame(frame);
}
function setPaused(p){
  var s=S.sess;if(!s||s.paused===p)return;
  s.paused=p;s.last=performance.now();
  $('#btnPause').innerHTML=p?ICON_PLAY:ICON_PAUSE;
  $('#btnPause').setAttribute('aria-label',p?'继续':'暂停');
  try{if(AC)p?AC.suspend():AC.resume()}catch(e){}
  if(p)Voice.stop();
}
function doneLoop(now){
  if(S.view!=='session'||S.sess||!$('#session').classList.contains('done'))return;
  sessBloom.draw(.62+.06*Math.sin(now/900),-1,1,now,0);
  raf=requestAnimationFrame(doneLoop);
}
function closeSession(){
  cancelAnimationFrame(raf);Voice.stop();lockOff();
  var ses=$('#session');
  ses.classList.remove('on','done');setInert(ses,true);
  S.view='home';
  setInert($('#home'),false);
  renderHome(0);startHome();
}
function finish(complete){
  var s=S.sess;if(!s)return;
  cancelAnimationFrame(raf);lockOff();Voice.stop();
  var breath=Math.max(0,Math.min(s.total,s.elapsed/1000-s.prep));
  var secs=complete?s.total:Math.round(breath);
  var cycles=complete?s.cycles:Math.floor(breath/s.L);
  S.sess=null;
  if(complete&&S.sound&&AC){try{AC.resume()}catch(e){}bell(523);bell(784,.45)}
  if(complete)buzz(30);
  if(secs>=30){
    DB.logs.push({d:ymd(new Date()),s:secs,k:s.t.id});
    if(DB.logs.length>400)DB.logs=DB.logs.slice(-400);
    saveDB();
    var st=stats();
    $('#dEye').textContent=complete?'一息已毕':'暂且收笔';
    $('#dTitle').textContent='吐纳'+cn(cycles)+'轮';
    $('#dSub').textContent=s.t.name+' · 用时 '+mmss(secs);
    $('#dSum').textContent='连续'+cn(st.streak)+'日 · 本周'+cn(st.weekMin)+'分钟';
    var sl=complete?['吐','纳','圆','满']:['吐','纳','暂','歇'];
    $('#dSeal').innerHTML=sl.map(function(c){return '<span>'+c+'</span>'}).join('');
    $('#session').classList.add('done');
    if(!isNative()&&depth===0)pushView();
    setTimeout(function(){buzz(30);sessBloom.splash()},520);
    if(complete&&S.voice)setTimeout(function(){Voice.speak(OUTRO)},700);
    raf=requestAnimationFrame(doneLoop);
  }else{
    closeSession();
  }
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&S.sess&&!S.sess.paused)setPaused(true);
});
document.addEventListener('keydown',function(e){
  if(S.view==='session'&&S.sess&&(e.key===' '||e.code==='Space')){e.preventDefault();setPaused(!S.sess.paused)}
  else if(e.key==='Escape')up();
  else if(S.view==='home'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&document.activeElement===$('#stage'))switchTech(e.key==='ArrowRight'?1:-1);
});

/* ===== 圆相上的手势：按住开始，左右轻划换一式 ===== */
var stage=$('#stage');
stage.addEventListener('pointerdown',function(e){
  if(S.view!=='home')return;
  hold.on=true;hold.done=false;hold.track=true;hold.moved=false;hold.t0=performance.now();hold.x0=e.clientX;
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  setHint('落墨…','hot');
});
stage.addEventListener('pointermove',function(e){
  if(!hold.track)return;
  if(!hold.moved&&Math.abs(e.clientX-hold.x0)>16){hold.moved=true;hold.on=false;setHint('松手换式','hot')}
});
function endPress(e,cancel){
  if(!hold.track)return;
  var wasOn=hold.on,dx=e.clientX-hold.x0,moved=hold.moved,done=hold.done;
  hold.track=false;hold.on=false;
  if(done){setHint('按住 · 落墨');return}
  if(!cancel&&moved&&Math.abs(dx)>40){switchTech(dx<0?1:-1);setHint('按住 · 落墨');return}
  if(!cancel&&!moved&&wasOn){setHint('再按久一点','shake');setTimeout(function(){setHint('按住 · 落墨')},1500);return}
  setHint('按住 · 落墨');
}
stage.addEventListener('pointerup',function(e){endPress(e,false)});
stage.addEventListener('pointercancel',function(e){endPress(e,true)});
stage.addEventListener('keydown',function(e){
  if(S.view==='home'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();startSession()}
});

/* ===== 点击 ===== */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='lib'){if(S.view==='home'){pushView();openLib()}}
  else if(a==='back'){up()}
  else if(a==='pick'){pickTech(b.dataset.id)}
  else if(a==='dot'){var i=+b.dataset.i;if(TECH[i].id!==S.tid){S.tid=TECH[i].id;savePrefs();setPalette(S.tid);renderHome(i>techIndex(S.tid)?1:-1)}}
  else if(a==='mins'){S.mins=+b.dataset.v;savePrefs();updateRuler();buzz(8)}
  else if(a==='toggle'){
    var k=b.dataset.v;S[k]=!S[k];savePrefs();
    if(S[k]&&k==='sound'){ensureAudio();bell(523)}
    if(S[k]&&k==='haptic')buzz(20);
    if(S[k]&&k==='voice'){Voice.load();Voice.speak('放松肩膀，我们慢慢开始。')}
    if(!S[k]&&k==='voice')Voice.stop();
    keepFocus(renderLib);
  }
  else if(a==='voice'){S.voiceName=b.dataset.name;savePrefs();Voice.speak('放松肩膀，我们慢慢开始。');keepFocus(renderLib)}
  else if(a==='step'){
    var key=b.dataset.k,d=+b.dataset.d,min=(key==='i'||key==='o')?1:0,max=(key==='i'||key==='o')?10:6;
    S.custom[key]=Math.max(min,Math.min(max,S.custom[key]+d));savePrefs();keepFocus(renderLib);renderHome(0);
  }
  else if(a==='again'){startSession()}
  else if(a==='pause'){if(S.sess)setPaused(!S.sess.paused)}
  else if(a==='end'){up()}
  else if(a==='finishclose'){up()}
});

/* ===== 启动 ===== */
buildRuler();
renderHome(0);
layoutHint();
sizeAll();
startHome();
})();
</script>

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
