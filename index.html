<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>吐纳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@300;500;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
<style>
:root{
  /* Layout: one-column phone app. Home (today's pick, goals, techniques, week) -> prepare -> full-screen breathing session -> done. The glowing orb is the single bold element; everything else stays quiet. */
  --bg:#ecf3f1;
  --surface:#f8fbfa;
  --surface-2:#dce9e6;
  --fg:#10302e;
  --muted:#4f6a68;
  --accent:#116861;
  --accent-ink:#f2fbf9;
  --line:rgb(16 48 46 / .14);
  --orb:34 146 136;
  --f-display:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"Spline Sans Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a181b;--surface:#11262a;--surface-2:#183135;--fg:#e2f0ed;--muted:#93b2ad;
    --accent:#7ed8c9;--accent-ink:#05231f;--line:rgb(226 240 237 / .14);--orb:110 214 199;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a181b;--surface:#11262a;--surface-2:#183135;--fg:#e2f0ed;--muted:#93b2ad;
  --accent:#7ed8c9;--accent-ink:#05231f;--line:rgb(226 240 237 / .14);--orb:110 214 199;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:500}

.wrap{max-width:520px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{display:flex;flex-direction:column;gap:26px}

/* ---------- home ---------- */
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--f-display);font-weight:300;font-size:40px;letter-spacing:.14em;line-height:1}
.brand .py{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.1em;padding-bottom:4px}
.greet{color:var(--muted);margin-top:10px}

.hero{border-radius:28px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(120% 90% at 85% -10%,rgb(var(--orb) / .26),transparent 62%),var(--surface)}
.hero h2{font-family:var(--f-display);font-weight:500;font-size:30px;letter-spacing:.06em;line-height:1.2}
.hero .ratio{font-family:var(--f-mono);font-size:13px;color:var(--accent);letter-spacing:.08em}
.hero p.blurb{color:var(--muted);max-width:34em}

.wave{position:relative;width:100%;aspect-ratio:320/96}
.wave svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wave-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.wave-area{fill:rgb(var(--orb) / .14);stroke:none}
.dot{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%);box-shadow:0 0 0 5px rgb(var(--orb) / .22),0 0 18px 2px rgb(var(--orb) / .45)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px 24px;border-radius:999px;font-weight:500;font-size:16px;letter-spacing:.04em}
.btn.primary{background:var(--accent);color:var(--accent-ink);width:100%}
.btn.primary:active{transform:scale(.985)}
.btn.soft{background:var(--surface-2)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 15px;border-radius:999px;border:1px solid var(--line);font-size:14px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.sec{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:10px}
.tech{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:2px 14px;text-align:left;width:100%;background:var(--surface);border-radius:22px;padding:16px 16px 15px;transition:background .15s}
.tech:hover{background:var(--surface-2)}
.tech .goals{font-size:12px;color:var(--muted);letter-spacing:.1em;grid-column:1}
.tech .name{font-family:var(--f-display);font-weight:500;font-size:19px;letter-spacing:.05em;grid-column:1}
.tech .ratio{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);letter-spacing:.06em;grid-column:1}
.tech .thumb{grid-column:2;grid-row:1 / span 3;align-self:center}
.tech .thumb .wave{aspect-ratio:120/44}
.tech .blurb{grid-column:1 / -1;color:var(--muted);font-size:13.5px;margin-top:6px;line-height:1.55}

.stats{background:var(--surface);border-radius:22px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:84px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar i{display:block;width:100%;max-width:30px;border-radius:8px;background:var(--surface-2);min-height:4px}
.bar.has i{background:rgb(var(--orb) / .7)}
.bar.today i{background:var(--accent)}
.bar span{font-size:12px;color:var(--muted)}
.bar.today span{color:var(--fg);font-weight:700}
.stat-line{color:var(--muted);font-size:13.5px}
.stat-line b{color:var(--fg);font-family:var(--f-mono);font-weight:500}
.foot{font-size:12px;color:var(--muted);text-align:center}

/* ---------- prepare ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);min-height:40px;align-self:flex-start;font-size:14px}
.p-head{display:flex;flex-direction:column;gap:8px}
.p-head h2{font-family:var(--f-display);font-weight:500;font-size:34px;letter-spacing:.08em;line-height:1.15}
.p-head p{color:var(--muted)}
.wavecard{background:var(--surface);border-radius:24px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:12px}
.wavecard .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hint{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.pcs{display:flex;flex-wrap:wrap;gap:8px}
.pc{display:flex;align-items:baseline;gap:8px;background:var(--surface-2);border-radius:14px;padding:7px 12px;font-size:13.5px}
.pc b{font-family:var(--f-mono);font-weight:500}
.how{display:flex;flex-direction:column;gap:8px}
.how p{max-width:34em}
.how .when{color:var(--muted);font-size:13.5px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stp{background:var(--surface);border-radius:18px;padding:12px 12px 12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stp label{font-size:14px}
.stp .ctl{display:flex;align-items:center;gap:6px}
.stp .ctl b{font-family:var(--f-mono);font-weight:500;min-width:26px;text-align:center}
.step-btn{width:34px;height:34px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:18px;line-height:1}
.step-btn:disabled{opacity:.35;cursor:default}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.sw{width:48px;height:28px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent-ink)}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.startbar{position:sticky;bottom:0;margin-inline:-16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 72%,transparent)}

/* ---------- session ---------- */
.session{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:6px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(110% 70% at 50% 38%,rgb(var(--orb) / .16),transparent 70%),var(--bg)}
.s-top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:520px;width:100%;margin:0 auto}
.s-title{display:flex;flex-direction:column;line-height:1.35}
.s-title #sName{font-family:var(--f-display);font-size:17px;letter-spacing:.08em}
.s-title #sRatio{font-size:12px;color:var(--muted);letter-spacing:.08em}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface)}
.orbwrap{flex:1;min-height:200px;position:relative;max-width:520px;width:100%;margin:0 auto}
.orbwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:112px}
.phase-word{font-family:var(--f-display);font-weight:300;font-size:46px;letter-spacing:.2em;padding-left:.2em;line-height:1.2}
.phase-word.pop{animation:pop .5s ease-out}
@keyframes pop{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.phase-count{font-family:var(--f-mono);font-size:22px;color:var(--accent);min-height:30px}
.cycle{font-size:13px;color:var(--muted)}
.s-bottom{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:520px;width:100%;margin:0 auto}
.remain{font-size:15px;color:var(--muted)}
.round{width:68px;height:68px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.ghost{justify-self:end;color:var(--muted);min-height:44px;padding:0 6px;font-size:14px}

/* ---------- done ---------- */
.done-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{background:var(--surface);border-radius:20px;padding:16px}
.big b{display:block;font-family:var(--f-mono);font-weight:500;font-size:30px;line-height:1.2}
.big span{font-size:13px;color:var(--muted)}
.btns{display:flex;flex-direction:column;gap:10px}

@media (prefers-reduced-motion:reduce){
  .phase-word.pop{animation:none}
  .sw,.sw::after,.tech{transition:none}
}
@media (max-width:360px){
  .steppers{grid-template-columns:1fr}
  .tech{grid-template-columns:minmax(0,1fr) 84px}
}
</style>

</head>
<body>
<div class="wrap">
  <main id="home"></main>
  <main id="prep" hidden></main>
  <main id="done" hidden></main>
</div>

<div id="session" class="session" hidden role="dialog" aria-label="呼吸练习">
  <div class="s-top">
    <div class="s-title"><span id="sName"></span><span id="sRatio" class="mono"></span></div>
    <button class="icon-btn" data-act="end" aria-label="结束练习">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="orbwrap" class="orbwrap"><canvas id="orb"></canvas></div>
  <div class="hud">
    <div id="phaseWord" class="phase-word" aria-live="polite">准备</div>
    <div id="phaseCount" class="phase-count">3</div>
    <div id="cycleInfo" class="cycle"></div>
  </div>
  <div class="s-bottom">
    <span id="remain" class="mono remain">00:00</span>
    <button id="btnPause" class="round" data-act="pause" aria-label="暂停"></button>
    <button class="ghost" data-act="end">结束</button>
  </div>
</div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};

/* ================= data ================= */
function mk(i,h,o,r){
  var p=[{k:'in',label:'吸气',secs:i,from:0,to:1}];
  if(h>0)p.push({k:'hold',label:'屏息',secs:h,from:1,to:1});
  p.push({k:'out',label:'呼气',secs:o,from:1,to:0});
  if(r>0)p.push({k:'rest',label:'停留',secs:r,from:0,to:0});
  return p;
}
var TECH=[
  {id:'box',name:'箱式呼吸',goals:['focus','relax'],phases:mk(4,4,4,4),
   blurb:'四个等长的阶段，节奏稳定，适合想保持清醒又想放松的时刻。',
   how:'鼻吸 4 秒，屏息 4 秒，缓慢呼出 4 秒，再停 4 秒。',when:'适合：开会前、专注工作前、压力上来时'},
  {id:'s478',name:'4-7-8 呼吸',goals:['sleep','relax'],phases:mk(4,7,8,0),
   blurb:'呼气是吸气的两倍，节奏偏慢，常用于睡前放松。',
   how:'鼻吸 4 秒，屏息 7 秒，用嘴缓慢呼出 8 秒。',when:'适合：睡前、夜里醒来后',
   note:'屏息较长，第一次练习建议控制在 3 分钟以内。'},
  {id:'coherent',name:'共振呼吸',goals:['relax','focus'],phases:mk(5.5,0,5.5,0),
   blurb:'每分钟约 5.5 次，吸呼等长、不停顿，节奏平稳连贯。',
   how:'鼻吸 5.5 秒，不屏息，轻轻呼出 5.5 秒。',when:'适合：日常放松、通勤路上、工作间隙'},
  {id:'sigh',name:'生理叹息',goals:['relax'],
   phases:[{k:'in',label:'吸气',secs:2,from:0,to:.78},{k:'in',label:'再吸一口',secs:1,from:.78,to:1},{k:'out',label:'呼气',secs:6,from:1,to:0}],
   blurb:'两次短吸、一次长呼，一轮约 9 秒，用来快速松下来。',
   how:'鼻吸一口，不呼气再补一小口，然后用嘴慢慢呼尽。',when:'适合：突然紧张、情绪起伏时，1 到 3 分钟即可'},
  {id:'r46',name:'4-6 放松呼吸',goals:['relax','sleep'],phases:mk(4,0,6,0),
   blurb:'呼气比吸气长，是最容易上手的放松节奏。',
   how:'鼻吸 4 秒，缓慢呼出 6 秒，肩膀自然下沉。',when:'适合：初学者、午休后、回家路上'},
  {id:'wake',name:'唤醒呼吸',goals:['energy'],phases:mk(2,0,2,0),
   blurb:'短促均匀的快节奏，用来提神。',
   how:'鼻吸 2 秒，鼻呼 2 秒，胸腹轻松起伏。',when:'适合：上午困倦、午后犯困',
   note:'节奏较快，感到头晕就停下，恢复自然呼吸。'},
  {id:'custom',name:'自定义节奏',goals:[],phases:null,
   blurb:'自己调整吸、屏、呼、停的秒数。',
   how:'在下方设定每个阶段的秒数，波形会同步变化。',when:'适合：已经找到自己舒服的节奏'}
];
var GOALS=[['all','全部'],['relax','放松'],['focus','专注'],['sleep','助眠'],['energy','活力']];
var GNAME={relax:'放松',focus:'专注',sleep:'助眠',energy:'活力'};
var WD=['日','一','二','三','四','五','六'];

/* ================= state & storage ================= */
var KEY='tuna.v1';
function loadDB(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){return {}}}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
var DB=loadDB();DB.logs=Array.isArray(DB.logs)?DB.logs:[];DB.prefs=DB.prefs||{};
var P=DB.prefs;
var S={view:'home',tid:null,goal:'all',
  mins:[1,3,5,10].indexOf(P.mins)>=0?P.mins:3,
  sound:P.sound!==false,voice:P.voice===true,
  custom:P.custom||{i:4,h:2,o:6,r:0},sess:null,last:null};
function savePrefs(){DB.prefs={mins:S.mins,sound:S.sound,voice:S.voice,custom:S.custom};saveDB()}

/* ================= helpers ================= */
function techById(id){for(var i=0;i<TECH.length;i++)if(TECH[i].id===id)return TECH[i];return TECH[0]}
function phasesOf(t){return t.id==='custom'?mk(S.custom.i,S.custom.h,S.custom.o,S.custom.r):t.phases}
function cycleLen(ph){var a=0;ph.forEach(function(p){a+=p.secs});return a}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function ratioOf(ph){return ph.map(function(p){return fmt(p.secs)}).join(' · ')}
function ease(f){return .5-.5*Math.cos(Math.PI*f)}
function levelOf(p,f){return (p.k==='in'||p.k==='out')?p.from+(p.to-p.from)*ease(f):p.to}
function locate(ph,tc){
  var a=0;
  for(var i=0;i<ph.length;i++){
    var p=ph[i];
    if(tc<a+p.secs||i===ph.length-1){
      var f=Math.min(1,Math.max(0,(tc-a)/p.secs));
      return {i:i,p:p,f:f,lv:levelOf(p,f),rem:p.secs-(tc-a)};
    }
    a+=p.secs;
  }
}
function plan(t){
  var ph=phasesOf(t),L=cycleLen(ph),cycles=Math.max(1,Math.round(S.mins*60/L));
  return {ph:ph,L:L,cycles:cycles,total:cycles*L};
}
function mmss(s){s=Math.max(0,Math.ceil(s-1e-6));var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r}
function pad2(n){return n<10?'0'+n:''+n}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}

/* ---- wave drawing ---- */
function waveSVG(ph,w,h,pad){
  var L=cycleLen(ph),a=0,pts=[];
  ph.forEach(function(p){
    var moving=(p.k==='in'||p.k==='out'),n=moving?16:2;
    for(var j=0;j<=n;j++){
      var f=j/n;
      pts.push([(a+p.secs*f)/L*w,h-pad-levelOf(p,f)*(h-2*pad)]);
    }
    a+=p.secs;
  });
  var d='M'+pts.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('L');
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true"><path class="wave-area" d="'+d+'L'+w+' '+h+'L0 '+h+'Z"/><path class="wave-line" d="'+d+'"/></svg>';
}
var WW=320,WH=96,WP=12;

/* ---- stats ---- */
function stats(){
  var map={},i;
  DB.logs.forEach(function(l){map[l.d]=(map[l.d]||0)+l.s});
  var today=new Date(),days=[],weekSecs=0;
  for(i=6;i>=0;i--){
    var d=new Date(today.getFullYear(),today.getMonth(),today.getDate()-i);
    var k=ymd(d),s=map[k]||0;weekSecs+=s;
    days.push({k:k,s:s,wd:WD[d.getDay()],today:i===0});
  }
  var streak=0,c=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  if(!map[ymd(c)])c.setDate(c.getDate()-1);
  while(map[ymd(c)]){streak++;c.setDate(c.getDate()-1)}
  return {days:days,streak:streak,weekMin:Math.round(weekSecs/60),count:DB.logs.length};
}

/* ================= render: home ================= */
function dayPart(){
  var h=new Date().getHours();
  if(h>=5&&h<10)return {g:'早上好',tag:'早晨',id:'wake'};
  if(h>=10&&h<14)return {g:'中午好',tag:'白天',id:'box'};
  if(h>=14&&h<17)return {g:'下午好',tag:'白天',id:'box'};
  if(h>=17&&h<21)return {g:'晚上好',tag:'傍晚',id:'coherent'};
  return {g:h<5?'夜深了':'晚上好',tag:'夜晚',id:'s478'};
}
function goalsText(t){return t.goals.length?t.goals.map(function(g){return GNAME[g]}).join(' · '):'自由调整'}

function renderHome(){
  var dp=dayPart(),rec=techById(dp.id),rp=phasesOf(rec),rpl=plan(rec);
  var list=TECH.filter(function(t){return S.goal==='all'||t.id==='custom'||t.goals.indexOf(S.goal)>=0});
  var st=stats(),maxS=5*60;
  st.days.forEach(function(d){if(d.s>maxS)maxS=d.s});
  var html='';
  html+='<header><div class="brand"><h1>吐纳</h1><span class="py">tǔ nà · 呼吸练习</span></div><p class="greet">'+dp.g+'，先把呼吸放慢一点。</p></header>';
  html+='<section class="hero" aria-label="今日推荐"><p class="eyebrow">今日推荐 · '+dp.tag+'</p>'+
    '<div><h2>'+rec.name+'</h2><p class="ratio" style="margin-top:6px;font-family:var(--f-mono);font-size:13px;color:var(--accent);letter-spacing:.08em">'+ratioOf(rp)+' 秒</p></div>'+
    '<p class="blurb">'+rec.blurb+'</p>'+
    '<div class="wave">'+waveSVG(rp,WW,WH,WP)+'<i class="dot" data-dot="'+rec.id+'"></i></div>'+
    '<button class="btn primary" data-act="quick" data-id="'+rec.id+'">开始 · 约 '+S.mins+' 分钟</button></section>';
  html+='<section class="sec"><p class="eyebrow">按目的选择</p><div class="chips" role="group" aria-label="目的">'+
    GOALS.map(function(g){return '<button class="chip" data-act="goal" data-v="'+g[0]+'" aria-pressed="'+(S.goal===g[0])+'">'+g[1]+'</button>'}).join('')+
    '</div><div class="list">'+
    list.map(function(t){
      var ph=phasesOf(t);
      return '<button class="tech" data-act="open" data-id="'+t.id+'"><span class="goals">'+goalsText(t)+'</span><span class="name">'+t.name+'</span><span class="ratio">'+ratioOf(ph)+' 秒</span>'+
        '<span class="thumb"><span class="wave" style="display:block">'+waveSVG(ph,120,44,7)+'</span></span><span class="blurb">'+t.blurb+'</span></button>';
    }).join('')+'</div></section>';
  html+='<section class="stats"><p class="eyebrow">最近 7 天</p><div class="bars">'+
    st.days.map(function(d){
      var h=d.s>0?Math.max(8,Math.round(d.s/maxS*56)):4;
      return '<div class="bar'+(d.s>0?' has':'')+(d.today?' today':'')+'" title="'+Math.round(d.s/60)+' 分钟"><i style="height:'+h+'px"></i><span>'+d.wd+'</span></div>';
    }).join('')+'</div>'+
    (st.count?'<p class="stat-line">连续 <b>'+st.streak+'</b> 天 · 本周 <b>'+st.weekMin+'</b> 分钟 · 累计 <b>'+st.count+'</b> 次</p>':'<p class="stat-line">完成第一次练习后，这里会记录连续天数和每天的练习时长。</p>')+
    '</section>';
  html+='<p class="foot">练习记录只保存在这台设备的浏览器里。</p>';
  $('#home').innerHTML=html;
}

/* ================= render: prepare ================= */
function renderPrep(){
  var t=techById(S.tid),ph=phasesOf(t),pl=plan(t);
  var html='<button class="back" data-act="home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>返回</button>';
  html+='<header class="p-head"><p class="eyebrow">'+goalsText(t)+'</p><h2>'+t.name+'</h2><p>'+t.blurb+'</p></header>';
  html+='<section class="wavecard"><div class="row"><span class="eyebrow">一轮 '+fmt(pl.L)+' 秒</span><span class="hint" id="phaseHint">&nbsp;</span></div>'+
    '<div class="wave">'+waveSVG(ph,WW,WH,WP)+'<i class="dot" data-dot="'+t.id+'" data-label="phaseHint"></i></div>'+
    '<div class="pcs">'+ph.map(function(p){return '<div class="pc"><span>'+p.label+'</span><b>'+fmt(p.secs)+'s</b></div>'}).join('')+'</div></section>';
  if(t.id==='custom'){
    var rows=[['i','吸气',1,12],['h','屏息',0,12],['o','呼气',1,12],['r','停留',0,12]];
    html+='<section class="steppers">'+rows.map(function(r){
      var v=S.custom[r[0]];
      return '<div class="stp"><label>'+r[1]+'</label><div class="ctl"><button class="step-btn" data-act="step" data-k="'+r[0]+'" data-d="-1" aria-label="'+r[1]+'减 1 秒"'+(v<=r[2]?' disabled':'')+'>−</button><b>'+v+'</b><button class="step-btn" data-act="step" data-k="'+r[0]+'" data-d="1" aria-label="'+r[1]+'加 1 秒"'+(v>=r[3]?' disabled':'')+'>+</button></div></div>';
    }).join('')+'</section>';
  }
  html+='<section class="how"><p class="eyebrow">怎么做</p><p>'+t.how+'</p><p class="when">'+t.when+'</p></section>';
  html+='<section class="sec"><p class="eyebrow">时长</p><div class="chips" role="group" aria-label="时长">'+
    [1,3,5,10].map(function(m){return '<button class="chip" data-act="mins" data-v="'+m+'" aria-pressed="'+(S.mins===m)+'">'+m+' 分钟</button>'}).join('')+
    '</div><p class="note">约 '+pl.cycles+' 轮，共 '+mmss(pl.total)+'，按完整的一轮结束。</p></section>';
  html+='<section class="sec"><div class="opt"><span>提示音</span><button class="sw" role="switch" data-act="toggle" data-v="sound" aria-checked="'+S.sound+'" aria-label="提示音"></button></div>'+
    '<div class="opt"><span>语音引导</span><button class="sw" role="switch" data-act="toggle" data-v="voice" aria-checked="'+S.voice+'" aria-label="语音引导"></button></div></section>';
  html+='<p class="note">'+(t.note?t.note+' ':'')+'出现头晕、手脚发麻时，恢复自然呼吸并停止练习。孕期或有心肺疾病时，练习前先咨询医生。</p>';
  html+='<div class="startbar"><button class="btn primary" data-act="start">开始 · 约 '+Math.round(pl.total/60*10)/10+' 分钟</button></div>';
  $('#prep').innerHTML=html;
}

/* ================= render: done ================= */
function renderDone(){
  var L=S.last,t=techById(L.tid),ph=L.ph;
  var html='<header class="p-head" style="margin-top:18px"><p class="eyebrow">'+(L.complete?'练习完成':'提前结束')+'</p><h2>'+(L.complete?'完成了 '+L.cycles+' 轮':'练习了 '+L.cycles+' 轮')+'</h2><p>'+t.name+'，用时 '+mmss(L.secs)+'。先安静坐一会儿，再回到手头的事。</p></header>';
  html+='<section class="wavecard"><div class="wave">'+waveSVG(ph,WW,WH,WP)+'</div></section>';
  var st=stats();
  html+='<section class="done-stats"><div class="big"><b>'+st.streak+'</b><span>连续练习天数</span></div><div class="big"><b>'+st.weekMin+'</b><span>本周累计分钟</span></div></section>';
  html+='<div class="btns"><button class="btn primary" data-act="again">再练一次</button><button class="btn soft" data-act="home">回到首页</button></div>';
  $('#done').innerHTML=html;
}

/* ================= views ================= */
var dotRaf=0;
function setView(v){
  S.view=v;
  ['home','prep','done'].forEach(function(id){$('#'+id).hidden=(id!==v)});
  $('#session').hidden=(v!=='session');
  document.body.classList.toggle('lock',v==='session');
  if(v!=='session'){window.scrollTo(0,0);if(!dotRaf)dotRaf=requestAnimationFrame(dotLoop)}
}
function keepFocus(fn){
  var a=document.activeElement,sel=null;
  if(a&&a.dataset&&a.dataset.act){
    sel='[data-act="'+a.dataset.act+'"]'+['k','d','v','id'].map(function(x){return a.dataset[x]!=null?'[data-'+x+'="'+a.dataset[x]+'"]':''}).join('');
  }
  fn();
  if(sel){var n=document.querySelector(sel);if(n)n.focus({preventScroll:true})}
}

/* moving dot on previews */
var hintCache='';
function dotLoop(now){
  if(S.view==='session'){dotRaf=0;return}
  var els=document.querySelectorAll('[data-dot]');
  for(var j=0;j<els.length;j++){
    var el=els[j],t=techById(el.dataset.dot),ph=phasesOf(t),L=cycleLen(ph),tc=(now/1000)%L,s=locate(ph,tc);
    el.style.left=(tc/L*100)+'%';
    el.style.top=((WH-WP-s.lv*(WH-2*WP))/WH*100)+'%';
    if(el.dataset.label){
      var lab=document.getElementById(el.dataset.label);
      if(lab){var txt=s.p.label+' · '+Math.max(1,Math.ceil(s.rem-1e-6))+'s';if(lab.textContent!==txt)lab.textContent=txt}
    }
  }
  dotRaf=requestAnimationFrame(dotLoop);
}

/* ================= audio & cues ================= */
var AC=null;
function ensureAudio(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
}
function tone(f0,f1,dur,vol,delay){
  if(!AC)return;
  try{
    var t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(f0,t0);
    o.frequency.linearRampToValueAtTime(f1,t0+dur);
    g.gain.setValueAtTime(0,t0);
    g.gain.linearRampToValueAtTime(vol,t0+Math.min(.5,dur*.3));
    g.gain.linearRampToValueAtTime(0,t0+dur);
    o.connect(g);g.connect(AC.destination);
    o.start(t0);o.stop(t0+dur+.05);
  }catch(e){}
}
function bell(f,delay){tone(f,f,1.7,.05,delay);tone(f*2.01,f*2.01,1.1,.018,delay)}
function pitch(l){return 260+170*l}
function cue(p){
  if(S.sound&&AC){
    if(p.k==='in'||p.k==='out')tone(pitch(p.from),pitch(p.to),Math.min(p.secs,7)*.95,.07);
    else bell(p.k==='hold'?660:440);
  }
  if(S.voice&&'speechSynthesis' in window){
    try{
      speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(p.label);
      u.lang='zh-CN';u.rate=.85;u.volume=.85;
      speechSynthesis.speak(u);
    }catch(e){}
  }
}

/* wake lock */
var wl=null;
function lockOn(){try{if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}}catch(e){}}
function lockOff(){try{if(wl)wl.release()}catch(e){}wl=null}

/* ================= session ================= */
var cv=$('#orb'),ctx=cv.getContext('2d'),raf=0,cw=0,ch=0,ORB=[34,146,136],frames=0;
var H={word:$('#phaseWord'),count:$('#phaseCount'),cycle:$('#cycleInfo'),remain:$('#remain')};
var ICON_PAUSE='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>';
var ICON_PLAY='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';

function sizeCanvas(){
  var w=$('#orbwrap'),dpr=Math.min(2,window.devicePixelRatio||1);
  cw=w.clientWidth;ch=w.clientHeight;
  cv.width=Math.max(1,Math.round(cw*dpr));cv.height=Math.max(1,Math.round(ch*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
if(window.ResizeObserver)new ResizeObserver(function(){if(S.view==='session'){sizeCanvas();if(S.sess)drawOrb(S.sess.lv||0,S.sess.pg||0)}}).observe($('#orbwrap'));
window.addEventListener('resize',function(){if(S.view==='session')sizeCanvas()});

function refreshColors(){
  try{
    var v=getComputedStyle(document.documentElement).getPropertyValue('--orb').trim().split(/\s+/).map(Number);
    if(v.length===3&&v.every(function(n){return !isNaN(n)}))ORB=v;
  }catch(e){}
}
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function mix(c,w){return [Math.round(c[0]+(255-c[0])*w),Math.round(c[1]+(255-c[1])*w),Math.round(c[2]+(255-c[2])*w)]}

function drawOrb(lv,pg){
  var sess=S.sess,dim=sess&&sess.paused?.5:1;
  ctx.clearRect(0,0,cw,ch);
  ctx.globalAlpha=dim;
  var cx=cw/2,cy=ch/2,Rm=Math.min(cw,ch)/2,R=Rm*.56,r=R*(.5+.5*lv);
  var g=ctx.createRadialGradient(cx,cy,r*.2,cx,cy,r*1.95);
  g.addColorStop(0,rgba(ORB,.30));g.addColorStop(1,rgba(ORB,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*1.95,0,Math.PI*2);ctx.fill();
  [1.14,1.28,1.44].forEach(function(k,i){
    ctx.beginPath();ctx.arc(cx,cy,r*k,0,Math.PI*2);
    ctx.strokeStyle=rgba(ORB,.26-.07*i);ctx.lineWidth=1.5;ctx.stroke();
  });
  var cg=ctx.createRadialGradient(cx-r*.28,cy-r*.32,r*.08,cx,cy,r);
  cg.addColorStop(0,rgba(mix(ORB,.55),.95));cg.addColorStop(.55,rgba(ORB,.78));cg.addColorStop(1,rgba(ORB,.42));
  ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  /* phase progress ring */
  var rr=Rm*.92,a0=-Math.PI/2,a1=a0+Math.PI*2*pg;
  ctx.lineWidth=3;ctx.lineCap='round';
  ctx.strokeStyle=rgba(ORB,.18);ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);ctx.stroke();
  if(pg>0.002){
    ctx.strokeStyle=rgba(ORB,.95);ctx.beginPath();ctx.arc(cx,cy,rr,a0,a1);ctx.stroke();
  }
  ctx.fillStyle=rgba(ORB,1);ctx.beginPath();ctx.arc(cx+rr*Math.cos(a1),cy+rr*Math.sin(a1),5,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
}

function setText(el,v){if(el.textContent!==v)el.textContent=v}

function startSession(){
  var t=techById(S.tid),pl=plan(t);
  ensureAudio();lockOn();
  S.sess={t:t,ph:pl.ph,L:pl.L,cycles:pl.cycles,total:pl.total,elapsed:0,last:performance.now(),paused:false,prep:3,key:-2,lv:0,pg:0};
  setView('session');
  $('#sName').textContent=t.name;
  $('#sRatio').textContent=ratioOf(pl.ph)+' 秒';
  $('#btnPause').innerHTML=ICON_PAUSE;
  $('#btnPause').setAttribute('aria-label','暂停');
  H.word.textContent='准备';H.count.textContent='3';H.cycle.textContent='放松肩膀，轻轻闭上眼';
  H.remain.textContent=mmss(pl.total);
  refreshColors();sizeCanvas();
  cancelAnimationFrame(raf);
  S.sess.last=performance.now();
  raf=requestAnimationFrame(frame);
}

function frame(now){
  var s=S.sess;
  if(!s||S.view!=='session')return;
  var dt=now-s.last;s.last=now;
  if(dt>100)dt=100;
  if(!s.paused)s.elapsed+=dt;
  var t=s.elapsed/1000-s.prep,lv=0,pg=0,word,count,cyc,key;
  if(t<0){
    word='准备';count=String(Math.ceil(-t));pg=s.elapsed/1000/s.prep;key=-1;cyc='放松肩膀，轻轻闭上眼';
  }else if(t>=s.total){
    finish(true);return;
  }else{
    var ci=Math.floor(t/s.L),tc=t-ci*s.L,loc=locate(s.ph,tc);
    lv=loc.lv;pg=loc.f;word=loc.p.label;count=String(Math.max(1,Math.ceil(loc.rem-1e-6)));
    key=ci*100+loc.i;cyc='第 '+(ci+1)+' / '+s.cycles+' 轮';
    if(key!==s.key){cue(loc.p)}
  }
  if(key!==s.key){
    s.key=key;
    H.word.textContent=word;
    H.word.classList.remove('pop');void H.word.offsetWidth;H.word.classList.add('pop');
  }
  setText(H.count,count);setText(H.cycle,cyc);
  setText(H.remain,mmss(t<0?s.total:s.total-t));
  s.lv=lv;s.pg=pg;
  if((frames++)%45===0)refreshColors();
  drawOrb(lv,pg);
  raf=requestAnimationFrame(frame);
}

function setPaused(p){
  var s=S.sess;if(!s||s.paused===p)return;
  s.paused=p;s.last=performance.now();
  $('#btnPause').innerHTML=p?ICON_PLAY:ICON_PAUSE;
  $('#btnPause').setAttribute('aria-label',p?'继续':'暂停');
  try{if(AC)p?AC.suspend():AC.resume()}catch(e){}
  try{if('speechSynthesis' in window&&p)speechSynthesis.cancel()}catch(e){}
  if(p)drawOrb(s.lv,s.pg);
}

function finish(complete){
  var s=S.sess;if(!s)return;
  cancelAnimationFrame(raf);lockOff();
  try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
  var breath=Math.max(0,Math.min(s.total,s.elapsed/1000-s.prep));
  var secs=complete?s.total:Math.round(breath);
  var cycles=complete?s.cycles:Math.floor(breath/s.L);
  S.sess=null;
  if(complete&&S.sound&&AC){try{AC.resume()}catch(e){}bell(523);bell(784,.45)}
  if(secs>=30){
    DB.logs.push({d:ymd(new Date()),s:secs,k:s.t.id});
    if(DB.logs.length>400)DB.logs=DB.logs.slice(-400);
    saveDB();
    S.last={tid:s.t.id,ph:s.ph,cycles:cycles,secs:secs,complete:complete};
    renderDone();setView('done');
  }else{
    renderPrep();setView('prep');
  }
}

document.addEventListener('visibilitychange',function(){
  if(document.hidden&&S.sess&&!S.sess.paused)setPaused(true);
});
document.addEventListener('keydown',function(e){
  if(S.view!=='session')return;
  if(e.key===' '||e.code==='Space'){e.preventDefault();setPaused(!S.sess.paused)}
  else if(e.key==='Escape'){finish(false)}
});

/* ================= events ================= */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='goal'){S.goal=b.dataset.v;keepFocus(renderHome)}
  else if(a==='open'||a==='quick'){
    S.tid=b.dataset.id;renderPrep();setView('prep');
    if(a==='quick')startSession();
  }
  else if(a==='home'){renderHome();setView('home')}
  else if(a==='mins'){S.mins=+b.dataset.v;savePrefs();keepFocus(renderPrep)}
  else if(a==='toggle'){
    var k=b.dataset.v;S[k]=!S[k];savePrefs();
    if(S[k]&&k==='sound')ensureAudio();
    keepFocus(renderPrep);
  }
  else if(a==='step'){
    var key=b.dataset.k,d=+b.dataset.d,min=(key==='i'||key==='o')?1:0,v=S.custom[key]+d;
    S.custom[key]=Math.max(min,Math.min(12,v));savePrefs();keepFocus(renderPrep);
  }
  else if(a==='start'){startSession()}
  else if(a==='pause'){if(S.sess)setPaused(!S.sess.paused)}
  else if(a==='end'){finish(false)}
  else if(a==='again'){S.tid=S.last?S.last.tid:S.tid;renderPrep();setView('prep')}
});

/* ================= boot ================= */
renderHome();
setView('home');
})();
</script>
